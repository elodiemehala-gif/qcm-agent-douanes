<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6558d9"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><link rel="manifest" href="manifest.webmanifest?v=4"><link rel="stylesheet" href="style-v2.css?v=4"><title>QCM Agent / Douanes</title></head><body><header class="top"><div class="brand"><div class="logo">Q</div><div><b>QCM Agent / Douanes</b><small>8 matières · vrais QCM + exercices type concours</small></div></div><button class="theme" id="themeToggle" aria-label="Changer de thème">◐</button></header><main id="app"><div class="card load"><span class="dot"></span><span>Chargement de la nouvelle banque QCM…</span></div></main><nav class="nav"><button data-r="home" class="on">Accueil</button><button data-r="quiz">Réviser</button><button data-r="inventory">Inventaire</button><button data-r="stats">Stats</button></nav><script>(()=>{const k='qcm-theme',b=document.documentElement,t=document.getElementById('themeToggle');const apply=v=>{b.dataset.theme=v;t.textContent=v==='dark'?'☀':'◐';localStorage.setItem(k,v)};apply(localStorage.getItem(k)||'light');t.onclick=()=>apply(b.dataset.theme==='dark'?'light':'dark')})();</script><script>(async()=>{const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Impossible de charger '+src));document.body.appendChild(s)});if('serviceWorker'in navigator&&navigator.serviceWorker.controller){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));location.reload();return}try{await load('helper.js?v=4');await load('engine-math.js?v=4');await load('engine-logic.js?v=4');await load('knowledge-engine.js?v=4');await load('math-course-links.js?v=4');await load('app.js?v=4');if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v=4').catch(console.error)}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Erreur de mise à jour</h2><p>'+e.message+'</p><p>Ferme cette page puis ouvre-la à nouveau.</p></div>'}})();</script></body></html>
