<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1506" viewBox="0 0 760 1506" role="img" aria-labelledby="title desc">
<title id="title">IV. Le XIXe siècle</title>
<desc id="desc">Frise chronologique verticale : Révolutions politiques et transformations sociales. Échelle non proportionnelle.</desc>
