<svg xmlns="http://www.w3.org/2000/svg" width="760" height="2051" viewBox="0 0 760 2051" role="img" aria-labelledby="title desc">
<title id="title">VI. La France contemporaine</title>
<desc id="desc">Frise chronologique verticale : Des acquis de la Libération à la Ve République. Échelle non proportionnelle.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172133" flood-opacity="0.10"/></filter>
<style>
.bg{fill:#f4f7fb}.title{font:700 31px Arial,sans-serif;fill:#172133}.subtitle{font:400 18px Arial,sans-serif;fill:#5b6575}.note{font:400 15px Arial,sans-serif;fill:#6b7280}.spine{stroke:#6558d9;stroke-width:5}.dot{fill:#ffffff;stroke:#6558d9;stroke-width:5}.date{font:700 19px Arial,sans-serif;fill:#3f348f}.event{font:600 22px Arial,sans-serif;fill:#172133}.card-a{fill:#ffffff;stroke:#dfe5ef;stroke-width:2}.card-b{fill:#eef1ff;stroke:#d8dcfb;stroke-width:2}
</style>
</defs>
<rect class="bg" width="760" height="2051" rx="30"/>
<text x="34" y="55" class="title" text-anchor="start">VI. La France contemporaine</text>
<text x="34" y="91" class="subtitle" text-anchor="start">Des acquis de la Libération à la Ve République</text>
<text x="34" y="122" class="note" text-anchor="start">Repères du cours - échelle volontairement non proportionnelle</text>
