<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1540" viewBox="0 0 760 1540" role="img" aria-labelledby="title desc">
<title id="title">IX. Culture, arts et littérature</title>
<desc id="desc">Frise chronologique verticale : Auteurs, œuvres et mouvements à situer. Échelle non proportionnelle.</desc>
<defs>
