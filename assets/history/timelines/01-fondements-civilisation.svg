<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1866" viewBox="0 0 760 1866" role="img" aria-labelledby="title desc">
<title id="title">I. Les fondements de la civilisation</title>
<desc id="desc">Frise chronologique verticale : Des premiers hominidés à la naissance de l&#x27;islam. Échelle non proportionnelle.</desc>
