<text x="34" y="129" class="subtitle" text-anchor="start">Repères de mandat et grandes figures mondiales</text>
<text x="34" y="160" class="note" text-anchor="start">Repères du cours - échelle volontairement non proportionnelle</text>
<line x1="178" y1="198" x2="178" y2="2106" class="spine"/>
