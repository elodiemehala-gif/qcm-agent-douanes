<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1895" viewBox="0 0 760 1895" role="img" aria-labelledby="title desc">
<title id="title">III. Révolution française et Empire</title>
<desc id="desc">Frise chronologique verticale : De la crise de 1789 à la Restauration. Échelle non proportionnelle.</desc>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172133" flood-opacity="0.10"/></filter>
<style>
.bg{fill:#f4f7fb}.title{font:700 31px Arial,sans-serif;fill:#172133}.subtitle{font:400 18px Arial,sans-serif;fill:#5b6575}.note{font:400 15px Arial,sans-serif;fill:#6b7280}.spine{stroke:#6558d9;stroke-width:5}.dot{fill:#ffffff;stroke:#6558d9;stroke-width:5}.date{font:700 19px Arial,sans-serif;fill:#3f348f}.event{font:600 22px Arial,sans-serif;fill:#172133}.card-a{fill:#ffffff;stroke:#dfe5ef;stroke-width:2}.card-b{fill:#eef1ff;stroke:#d8dcfb;stroke-width:2}
</style>
</defs>
<rect class="bg" width="760" height="1895" rx="30"/>
<text x="34" y="55" class="title" text-anchor="start">III. Révolution française et Empire</text>
<text x="34" y="91" class="subtitle" text-anchor="start">De la crise de 1789 à la Restauration</text>
<text x="34" y="122" class="note" text-anchor="start">Repères du cours - échelle volontairement non proportionnelle</text>
<line x1="178" y1="160" x2="178" y2="1841" class="spine"/>
<rect x="212" y="187" width="514" height="72" rx="18" class="card-a" filter="url(#shadow)"/>
<circle cx="178" cy="220" r="10" class="dot"/>
<text x="151" y="226" class="date" text-anchor="end">mai 1789</text>
<text x="236" y="228" class="event" text-anchor="start">Ouverture des États généraux</text>
<rect x="212" y="269" width="514" height="90" rx="18" class="card-b" filter="url(#shadow)"/>
<circle cx="178" cy="311" r="10" class="dot"/>
<text x="151" y="306" class="date" text-anchor="end">20 juin</text>
<text x="151" y="328" class="date" text-anchor="end">1789</text>
<text x="236" y="319" class="event" text-anchor="start">Serment du Jeu de Paume</text>
