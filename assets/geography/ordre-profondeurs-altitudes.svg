<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Comparer profondeur océanique et altitude des sommets</title>
<desc id="desc">La fosse des Mariannes atteint environ onze mille mètres de profondeur, l’Everest huit mille huit cent quarante-neuf mètres d’altitude et le mont Blanc quatre mille huit cent neuf mètres.</desc>
<style>
.bg{fill:#f8fbff}.title{font:700 34px system-ui,sans-serif;fill:#172133}.subtitle{font:500 17px system-ui,sans-serif;fill:#526172}.label{font:700 18px system-ui,sans-serif;fill:#172133}.small{font:600 14px system-ui,sans-serif;fill:#334155}.note{font:500 14px system-ui,sans-serif;fill:#64748b}.card{fill:#fff;stroke:#d8e1ea;stroke-width:1.5}.tick{stroke:#a9bdcc;stroke-width:1}.zero{stroke:#155e75;stroke-width:3}
</style>
<rect width="1200" height="760" rx="28" class="bg"/>
<text x="60" y="52" class="title">11 km sous la mer, 8,8 km au-dessus</text>
<text x="60" y="80" class="subtitle">La même échelle permet de comparer la fosse des Mariannes et les grands sommets.</text>
<rect x="60" y="110" width="1080" height="525" rx="22" fill="#fff" stroke="#d8e1ea" stroke-width="1.5"/>
<rect x="75" y="370" width="1050" height="250" rx="0" fill="#dff3fa"/>
<line x1="75" y1="370" x2="1125" y2="370" class="zero"/>
<text x="92" y="357" class="small">NIVEAU DE LA MER — 0 m</text>
<g class="tick">
<line x1="150" y1="145" x2="1120" y2="145"/><line x1="150" y1="245" x2="1120" y2="245"/><line x1="150" y1="495" x2="1120" y2="495"/><line x1="150" y1="595" x2="1120" y2="595"/>
</g>
<text x="92" y="150" class="small">+10 km</text><text x="92" y="250" class="small">+5 km</text><text x="92" y="500" class="small">−5 km</text><text x="92" y="600" class="small">−10 km</text>
<path d="M255 370 L340 168 L425 370 Z" fill="#0e7490"/><path d="M485 370 L555 260 L625 370 Z" fill="#38b6d1"/>
<rect x="765" y="370" width="120" height="245" rx="18" fill="#155e75"/>
<text x="340" y="145" text-anchor="middle" class="label">Everest</text><text x="340" y="390" text-anchor="middle" class="small">8 849 m</text>
<text x="555" y="237" text-anchor="middle" class="label">Mont Blanc</text><text x="555" y="390" text-anchor="middle" class="small">4 809 m</text>
<text x="825" y="650" text-anchor="middle" class="label">Fosse des Mariannes</text><text x="825" y="677" text-anchor="middle" class="small">≈ 11 000 m de profondeur</text>
<path d="M950 370 L950 565" stroke="#ef476f" stroke-width="5" stroke-dasharray="8 7"/><path d="M938 550 L950 568 L962 550" fill="none" stroke="#ef476f" stroke-width="5"/>
<text x="975" y="470" class="small">plus profonde</text><text x="975" y="491" class="small">que l’Everest</text><text x="975" y="512" class="small">n’est haut</text>
<rect x="60" y="655" width="1080" height="65" rx="18" class="card"/>
<text x="86" y="695" class="subtitle">Même posé au fond de la fosse, l’Everest resterait encore à environ 2,2 km sous la surface.</text>
<text x="60" y="744" class="note">Valeurs arrondies pour faciliter la mémorisation.</text>
</svg>
