<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Altitude des grands sommets</title><desc id="desc">Même échelle verticale : les écarts deviennent immédiatement visibles.</desc>

<style>
  .bg{fill:#f8fbff}.sea{fill:#dff3fa}.grid{stroke:#b9dbe7;stroke-width:1;opacity:.65}.land{fill:#f2efe7;stroke:#fff;stroke-width:1}
  .title{font:700 34px system-ui,sans-serif;fill:#172133}.subtitle{font:500 17px system-ui,sans-serif;fill:#526172}
  .label{font:700 19px system-ui,sans-serif;fill:#155e75;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .small{font:600 14px system-ui,sans-serif;fill:#334155}.note{font:500 14px system-ui,sans-serif;fill:#64748b}
  .legend{fill:#fff;stroke:#d8e1ea;stroke-width:1.5}.marker{fill:#ef476f;stroke:#fff;stroke-width:3}
  .markerText{font:800 13px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
</style><rect width="1200" height="650" rx="28" class="bg"/>
<text x="60" y="48" class="title">Altitude des grands sommets</text><text x="60" y="75" class="subtitle">Même échelle verticale : les écarts deviennent immédiatement visibles.</text><text x="70" y="170" class="small" style="font-size:18px">Everest</text>
<rect x="260" y="145" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="145" width="820" height="38" rx="12" fill="#155e75"/>
<text x="1090" y="170" class="small">8 849 m</text><text x="70" y="252" class="small" style="font-size:18px">K2</text>
<rect x="260" y="227" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="227" width="797.9" height="38" rx="12" fill="#0e7490"/>
<text x="1069.945530568426" y="252" class="small">8 611 m</text><text x="70" y="334" class="small" style="font-size:18px">Aconcagua</text>
<rect x="260" y="309" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="309" width="645" height="38" rx="12" fill="#0891b2"/>
<text x="917.0468979545711" y="334" class="small">6 961 m</text><text x="70" y="416" class="small" style="font-size:18px">Mont Blanc</text>
<rect x="260" y="391" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="391" width="445.6" height="38" rx="12" fill="#22a3c2"/>
<text x="717.6300146909255" y="416" class="small">4 809 m</text><rect x="60" y="550" width="1080" height="55" rx="15" class="legend"/><text x="82" y="584" class="subtitle">Everest et K2 dépassent 8 000 m ; l’Aconcagua approche 7 000 m ; le mont Blanc approche 5 000 m.</text>
<text x="60" y="626" class="note">Schéma pédagogique — positions et valeurs arrondies pour faciliter la mémorisation.</text>
</svg>
