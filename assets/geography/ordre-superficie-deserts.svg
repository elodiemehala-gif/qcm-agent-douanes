<text x="791.7183098591549" y="334" class="small">≈ 9 millions de km²</text><rect x="60" y="550" width="1080" height="55" rx="15" class="legend"/><text x="82" y="584" class="subtitle">Ordre à mémoriser : Antarctique → Arctique → Sahara.</text>
<text x="60" y="626" class="note">Schéma pédagogique — positions et valeurs arrondies pour faciliter la mémorisation.</text>
