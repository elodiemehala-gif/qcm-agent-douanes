<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Longueur de quelques chaînes de montagnes</title><desc id="desc">Comparaison en ordre de grandeur, avec des valeurs arrondies.</desc>

<style>
  .bg{fill:#f8fbff}.sea{fill:#dff3fa}.grid{stroke:#b9dbe7;stroke-width:1;opacity:.65}.land{fill:#f2efe7;stroke:#fff;stroke-width:1}
  .title{font:700 34px system-ui,sans-serif;fill:#172133}.subtitle{font:500 17px system-ui,sans-serif;fill:#526172}
  .label{font:700 19px system-ui,sans-serif;fill:#155e75;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .small{font:600 14px system-ui,sans-serif;fill:#334155}.note{font:500 14px system-ui,sans-serif;fill:#64748b}
  .legend{fill:#fff;stroke:#d8e1ea;stroke-width:1.5}.marker{fill:#ef476f;stroke:#fff;stroke-width:3}
  .markerText{font:800 13px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
</style><rect width="1200" height="650" rx="28" class="bg"/>
<text x="60" y="48" class="title">Longueur de quelques chaînes de montagnes</text><text x="60" y="75" class="subtitle">Comparaison en ordre de grandeur, avec des valeurs arrondies.</text><text x="70" y="170" class="small" style="font-size:18px">Andes</text>
<rect x="260" y="145" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="145" width="820" height="38" rx="12" fill="#155e75"/>
<text x="1090" y="170" class="small">≈ 7 000 km</text><text x="70" y="252" class="small" style="font-size:18px">Rocheuses</text>
<rect x="260" y="227" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="227" width="562.3" height="38" rx="12" fill="#0e7490"/>
<text x="834.2857142857143" y="252" class="small">≈ 4 800 km</text><text x="70" y="334" class="small" style="font-size:18px">Himalaya</text>
<rect x="260" y="309" width="820" height="38" rx="12" fill="#e7eef4"/>
<rect x="260" y="309" width="281.1" height="38" rx="12" fill="#0891b2"/>
