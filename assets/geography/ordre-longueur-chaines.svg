<text x="412.57142857142856" y="416" class="small">≈ 1 200 km</text><rect x="60" y="550" width="1080" height="55" rx="15" class="legend"/><text x="82" y="584" class="subtitle">Les Andes sont presque trois fois plus longues que l’Himalaya, mais l’Himalaya possède les plus hauts sommets.</text>
<text x="60" y="626" class="note">Schéma pédagogique — positions et valeurs arrondies pour faciliter la mémorisation.</text>
