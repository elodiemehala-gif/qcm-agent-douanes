<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2260" viewBox="0 0 1200 2260" role="img" aria-labelledby="title desc">
  <title id="title">Organisations internationales : chronologie et nature</title>
  <desc id="desc">Frise chronologique allant de 1944 à 2016. Elle distingue les institutions financières, l'ONU, l'OTAN, l'Union européenne, l'OPEP, l'ASEAN, le G7, le G20, les BRICS et l'OPEP plus.</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10243d" flood-opacity="0.10"/></filter></defs>
  <style>
    .bg{fill:#f7fafc}.header{fill:#10243d}.title{font:700 39px system-ui,sans-serif;fill:#fff}.subtitle{font:500 18px system-ui,sans-serif;fill:#dce7f3}.timeline{stroke:#c7d4e3;stroke-width:7;stroke-linecap:round}
    .year{font:800 21px system-ui,sans-serif;fill:#10243d;text-anchor:middle}.yearSmall{font:700 15px system-ui,sans-serif;fill:#526172;text-anchor:middle}.card{fill:#fff;stroke:#dbe4ec;stroke-width:1.5;filter:url(#shadow)}
    .name{font:800 28px system-ui,sans-serif;fill:#172133}.nature{font:750 15px system-ui,sans-serif;letter-spacing:.25px}.body{font:500 17px system-ui,sans-serif;fill:#334155}.bodyStrong{font:700 17px system-ui,sans-serif;fill:#25364a}
    .tag{font:750 13px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}.sectionTitle{font:800 25px system-ui,sans-serif;fill:#172133}.trapTitle{font:800 17px system-ui,sans-serif;fill:#172133}.trapBody{font:500 15px system-ui,sans-serif;fill:#526172}.footer{font:500 13px system-ui,sans-serif;fill:#6b7787}
    .financeFill{fill:#d9f4eb}.financeText{fill:#17634f}.globalFill{fill:#e9e2fa}.globalText{fill:#5b3a91}.militaryFill{fill:#ffe0e4}.militaryText{fill:#a22f42}.regionalFill{fill:#dcecfb}.regionalText{fill:#245c8a}.energyFill{fill:#ffead5}.energyText{fill:#985418}.forumFill{fill:#e8edf3}.forumText{fill:#45576d}
  </style>
  <rect width="1200" height="2260" rx="30" class="bg"/><path d="M30 0H1170Q1200 0 1200 30V205H0V30Q0 0 30 0Z" class="header"/>
  <text x="60" y="62" class="title">Organisations internationales</text><text x="60" y="96" class="subtitle">Chronologie, nature et rôle essentiel — du plus ancien au plus récent</text>
  <g transform="translate(60 130)"><rect x="0" y="0" width="150" height="36" rx="18" class="financeFill"/><text x="75" y="18" class="tag financeText">FINANCE</text><rect x="163" y="0" width="155" height="36" rx="18" class="globalFill"/><text x="240.5" y="18" class="tag globalText">COOPÉRATION</text><rect x="331" y="0" width="135" height="36" rx="18" class="militaryFill"/><text x="398.5" y="18" class="tag militaryText">MILITAIRE</text><rect x="479" y="0" width="145" height="36" rx="18" class="regionalFill"/><text x="551.5" y="18" class="tag regionalText">RÉGIONAL</text><rect x="637" y="0" width="125" height="36" rx="18" class="energyFill"/><text x="699.5" y="18" class="tag energyText">ÉNERGIE</text><rect x="775" y="0" width="205" height="36" rx="18" class="forumFill"/><text x="877.5" y="18" class="tag forumText">FORUM / GROUPE</text></g>
  <line x1="172" y1="250" x2="172" y2="1850" class="timeline"/>

  <circle cx="172" cy="310" r="18" class="financeFill" stroke="#2a8a70" stroke-width="6"/><text x="93" y="307" class="year">1944</text><text x="93" y="331" class="yearSmall">Bretton Woods</text>
  <rect x="230" y="240" width="445" height="178" rx="22" class="card"/><rect x="255" y="263" width="110" height="29" rx="14" class="financeFill"/><text x="310" y="278" class="tag financeText">FINANCE</text><text x="255" y="329" class="name">FMI</text><text x="255" y="360" class="nature financeText">INSTITUTION FINANCIÈRE MONDIALE</text><text x="255" y="391" class="body">Stabilité monétaire et prêts aux États</text>
  <rect x="695" y="240" width="445" height="178" rx="22" class="card"/><rect x="720" y="263" width="110" height="29" rx="14" class="financeFill"/><text x="775" y="278" class="tag financeText">FINANCE</text><text x="720" y="329" class="name">Banque mondiale</text><text x="720" y="360" class="nature financeText">BANQUE DE DÉVELOPPEMENT</text><text x="720" y="391" class="body">Projets de long terme et réduction de la pauvreté</text>

  <circle cx="172" cy="492" r="18" class="globalFill" stroke="#7657ad" stroke-width="6"/><text x="93" y="500" class="year">1945</text><rect x="230" y="437" width="910" height="130" rx="22" class="card"/><rect x="255" y="459" width="145" height="29" rx="14" class="globalFill"/><text x="327.5" y="474" class="tag globalText">COOPÉRATION</text><text x="425" y="484" class="name">ONU</text><text x="255" y="522" class="nature globalText">ORGANISATION INTERGOUVERNEMENTALE À VOCATION UNIVERSELLE</text><text x="255" y="548" class="body">Paix · sécurité · droits humains · développement</text>

  <circle cx="172" cy="645" r="18" class="militaryFill" stroke="#bd4056" stroke-width="6"/><text x="93" y="653" class="year">1949</text><rect x="230" y="587" width="910" height="130" rx="22" class="card"/><rect x="255" y="609" width="125" height="29" rx="14" class="militaryFill"/><text x="317.5" y="624" class="tag militaryText">MILITAIRE</text><text x="405" y="634" class="name">OTAN</text><text x="255" y="672" class="nature militaryText">ALLIANCE MILITAIRE ENTRE L’AMÉRIQUE DU NORD ET L’EUROPE</text><text x="255" y="698" class="body">Défense collective : une attaque contre un allié concerne tous les autres (article 5)</text>

  <circle cx="172" cy="807" r="18" class="regionalFill" stroke="#3d79aa" stroke-width="6"/><text x="93" y="799" class="year">1951</text><text x="93" y="824" class="yearSmall">→ 1993</text><rect x="230" y="737" width="910" height="155" rx="22" class="card"/><rect x="255" y="759" width="130" height="29" rx="14" class="regionalFill"/><text x="320" y="774" class="tag regionalText">RÉGIONAL</text><text x="410" y="784" class="name">Union européenne (UE)</text><text x="255" y="821" class="nature regionalText">UNION POLITIQUE ET ÉCONOMIQUE SUPRANATIONALE</text><text x="255" y="849" class="bodyStrong">1951 CECA → 1957 CEE → 1993 UE</text><text x="255" y="876" class="body">Marché unique, institutions communes et euro pour une partie de ses membres</text>

  <circle cx="172" cy="965" r="18" class="energyFill" stroke="#c9782d" stroke-width="6"/><text x="93" y="973" class="year">1960</text><rect x="230" y="912" width="910" height="125" rx="22" class="card"/><rect x="255" y="934" width="112" height="29" rx="14" class="energyFill"/><text x="311" y="949" class="tag energyText">ÉNERGIE</text><text x="392" y="959" class="name">OPEP</text><text x="255" y="997" class="nature energyText">ORGANISATION INTERGOUVERNEMENTALE DE PAYS EXPORTATEURS DE PÉTROLE</text><text x="255" y="1023" class="body">Coordonne les politiques pétrolières et les niveaux de production</text>

  <circle cx="172" cy="1110" r="18" class="regionalFill" stroke="#3d79aa" stroke-width="6"/><text x="93" y="1118" class="year">1967</text><rect x="230" y="1057" width="910" height="125" rx="22" class="card"/><rect x="255" y="1079" width="130" height="29" rx="14" class="regionalFill"/><text x="320" y="1094" class="tag regionalText">RÉGIONAL</text><text x="410" y="1104" class="name">ASEAN</text><text x="255" y="1142" class="nature regionalText">ORGANISATION RÉGIONALE D’ASIE DU SUD-EST</text><text x="255" y="1168" class="body">Coopération politique et économique entre États de la région</text>

  <circle cx="172" cy="1267" r="18" class="forumFill" stroke="#63758a" stroke-width="6"/><text x="93" y="1259" class="year">1975</text><text x="93" y="1284" class="yearSmall">→ 1976</text><rect x="230" y="1202" width="910" height="150" rx="22" class="card"/><rect x="255" y="1224" width="177" height="29" rx="14" class="forumFill"/><text x="343.5" y="1239" class="tag forumText">FORUM INFORMEL</text><text x="457" y="1249" class="name">G7</text><text x="255" y="1287" class="nature forumText">GROUPE DE DÉMOCRATIES INDUSTRIALISÉES</text><text x="255" y="1314" class="bodyStrong">1975 : G6 → 1976 : G7 avec l’entrée du Canada</text><text x="255" y="1340" class="body">Concertation économique et politique · ni traité fondateur, ni armée</text>

  <circle cx="172" cy="1425" r="18" class="forumFill" stroke="#63758a" stroke-width="6"/><text x="93" y="1433" class="year">1999</text><rect x="230" y="1372" width="910" height="125" rx="22" class="card"/><rect x="255" y="1394" width="177" height="29" rx="14" class="forumFill"/><text x="343.5" y="1409" class="tag forumText">FORUM INFORMEL</text><text x="457" y="1419" class="name">G20</text><text x="255" y="1457" class="nature forumText">FORUM DE COOPÉRATION ÉCONOMIQUE MONDIALE</text><text x="255" y="1483" class="body">Grandes économies développées et émergentes, Union européenne et Union africaine</text>

  <circle cx="172" cy="1590" r="18" class="forumFill" stroke="#63758a" stroke-width="6"/><text x="93" y="1582" class="year">2006</text><text x="93" y="1607" class="yearSmall">→ 2011</text><rect x="230" y="1517" width="910" height="165" rx="22" class="card"/><rect x="255" y="1539" width="177" height="29" rx="14" class="forumFill"/><text x="343.5" y="1554" class="tag forumText">GROUPE INFORMEL</text><text x="457" y="1564" class="name">BRICS</text><text x="255" y="1602" class="nature forumText">GROUPE POLITIQUE ET ÉCONOMIQUE DE PUISSANCES ÉMERGENTES</text><text x="255" y="1630" class="bodyStrong">2006 : premiers échanges → 2009 : premier sommet → 2011 : Afrique du Sud</text><text x="255" y="1657" class="body">Renforcer le poids du Sud global dans la gouvernance mondiale · pas une alliance militaire</text>

  <circle cx="172" cy="1754" r="18" class="energyFill" stroke="#c9782d" stroke-width="6"/><text x="93" y="1762" class="year">2016</text><rect x="230" y="1702" width="910" height="125" rx="22" class="card"/><rect x="255" y="1724" width="112" height="29" rx="14" class="energyFill"/><text x="311" y="1739" class="tag energyText">ÉNERGIE</text><text x="392" y="1749" class="name">OPEP+</text><text x="255" y="1787" class="nature energyText">FORMAT ÉLARGI DE COORDINATION PÉTROLIÈRE</text><text x="255" y="1813" class="body">Membres de l’OPEP + producteurs partenaires, notamment la Russie</text>

  <text x="60" y="1905" class="sectionTitle">Les quatre distinctions à retenir</text>
  <rect x="60" y="1930" width="525" height="112" rx="18" class="card"/><text x="84" y="1963" class="trapTitle">ONU ≠ OTAN</text><text x="84" y="1990" class="trapBody">ONU : coopération presque universelle.</text><text x="84" y="2016" class="trapBody">OTAN : alliance militaire de défense collective.</text>
  <rect x="615" y="1930" width="525" height="112" rx="18" class="card"/><text x="639" y="1963" class="trapTitle">FMI ≠ Banque mondiale</text><text x="639" y="1990" class="trapBody">FMI : crises et stabilité monétaire.</text><text x="639" y="2016" class="trapBody">Banque mondiale : développement de long terme.</text>
  <rect x="60" y="2060" width="525" height="112" rx="18" class="card"/><text x="84" y="2093" class="trapTitle">G7 · G20 · BRICS</text><text x="84" y="2120" class="trapBody">Ce sont des groupes de concertation :</text><text x="84" y="2146" class="trapBody">ils ne forment ni un État mondial ni une armée.</text>
  <rect x="615" y="2060" width="525" height="112" rx="18" class="card"/><text x="639" y="2093" class="trapTitle">OPEP ≠ OPEP+</text><text x="639" y="2120" class="trapBody">OPEP+ n’est pas une nouvelle organisation :</text><text x="639" y="2146" class="trapBody">c’est l’OPEP élargie à des partenaires.</text>
  <text x="60" y="2218" class="footer">Dates retenues pour la mémorisation : création officielle ou première étape structurante du format.</text>
</svg>
