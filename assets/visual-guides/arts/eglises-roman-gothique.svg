<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Églises : roman ou gothique ?</title><desc id="desc">Regarder les arcs, les murs, la hauteur et la lumière</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#be185d"/>
<circle cx="1080" cy="72" r="95" fill="#be185d" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Églises : roman ou gothique ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Regarder les arcs, les murs, la hauteur et la lumière</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Style roman · XIe–XIIe</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Arc en plein cintre : arrondi</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Murs épais et ouvertures petites</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Édifice massif, plutôt sombre</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Style gothique · dès le XIIe</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Arc brisé : ogive</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Voûte sur croisée d’ogives</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Arcs-boutants et grandes verrières</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Repères romans</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Sainte-Foy de Conques</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Basilique de Vézelay</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Abbayes et églises massives</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Repères gothiques</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Notre-Dame de Paris</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Cathédrales de Chartres et Reims</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Hauteur, lumière, vitraux</text></svg>