<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Les mouvements artistiques du XIXe siècle</title><desc id="desc">Une question centrale et un indice visuel par mouvement</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#be185d"/>
<circle cx="1080" cy="72" r="95" fill="#be185d" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Les mouvements artistiques du XIXe siècle</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Une question centrale et un indice visuel par mouvement</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Romantisme</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Émotion, drame, imagination</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Couleurs et mouvement</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Géricault, Delacroix</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Réalisme</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Vie contemporaine et monde social</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Refus de l’idéalisation</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Courbet, Millet</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Impressionnisme</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Lumière et instant</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Peinture en plein air, touches visibles</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Monet, Renoir, Degas</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Postimpressionnisme</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Couleur et construction plus personnelles</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Van Gogh, Cézanne, Gauguin</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Ouvre vers l’art moderne</text></svg>