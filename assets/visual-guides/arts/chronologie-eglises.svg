<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Chronologie de l’architecture des églises</title><desc id="desc">Suivre les grandes transformations, des basiliques aux édifices contemporains</desc>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/><rect width="18" height="820" rx="9" fill="#be185d"/>
<text x="62" y="82" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Chronologie de l’architecture des églises</text>
<text x="62" y="132" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Suivre les grandes transformations, des basiliques aux édifices contemporains</text>
<style>text{font-family:Inter,Arial,sans-serif}</style><circle cx="105" cy="238" r="31" fill="#be185d"/><text x="105" y="247" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">1</text><rect x="158" y="190" width="954" height="97" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="233" font-size="28" font-weight="820" fill="#be185d">IVe–VIe siècles · paléochrétien</text><text x="190" y="269" font-size="21" font-weight="540" fill="#26344d">Plan basilical hérité de Rome · nef centrale et abside</text><path d="M105 290 V 305" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><path d="M96 296 L105 305 L114 296" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="357" r="31" fill="#be185d"/><text x="105" y="366" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">2</text><rect x="158" y="309" width="954" height="97" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="352" font-size="28" font-weight="820" fill="#be185d">XIe–XIIe siècles · roman</text><text x="190" y="388" font-size="21" font-weight="540" fill="#26344d">Arc en plein cintre · murs épais, petites ouvertures</text><path d="M105 409 V 424" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><path d="M96 415 L105 424 L114 415" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="476" r="31" fill="#be185d"/><text x="105" y="485" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">3</text><rect x="158" y="428" width="954" height="97" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="471" font-size="28" font-weight="820" fill="#be185d">XIIe–XVe siècles · gothique</text><text x="190" y="507" font-size="21" font-weight="540" fill="#26344d">Arc brisé et croisées d’ogives · arcs-boutants, hauteur et vitraux</text><path d="M105 527 V 542" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><path d="M96 533 L105 542 L114 533" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="595" r="31" fill="#be185d"/><text x="105" y="604" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">4</text><rect x="158" y="546" width="954" height="97" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="589" font-size="28" font-weight="820" fill="#be185d">XVIe–XVIIIe siècles</text><text x="190" y="625" font-size="21" font-weight="540" fill="#26344d">Renaissance, classicisme et baroque · Antiquité, ordre puis décor théâtral</text><path d="M105 646 V 661" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><path d="M96 652 L105 661 L114 652" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="714" r="31" fill="#be185d"/><text x="105" y="723" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">5</text><rect x="158" y="665" width="954" height="97" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="708" font-size="28" font-weight="820" fill="#be185d">XIXe–XXIe siècles</text><text x="190" y="744" font-size="21" font-weight="540" fill="#26344d">Néo-gothique puis matériaux modernes · restaurations, béton, verre et formes</text><text x="190" y="775" font-size="21" font-weight="540" fill="#26344d">nouvelles</text></svg>