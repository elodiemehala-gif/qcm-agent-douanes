<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Baroque ou classicisme ?</title><desc id="desc">Deux esthétiques majeures du XVIIe siècle</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#be185d"/>
<circle cx="1080" cy="72" r="95" fill="#be185d" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Baroque ou classicisme ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Deux esthétiques majeures du XVIIe siècle</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Baroque</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Mouvement et courbes</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Contrastes, théâtralité, émotion</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Caravage, Rubens, Le Bernin</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#be185d">Classicisme</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Ordre, équilibre, clarté</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Composition maîtrisée</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Poussin, architecture de Versailles</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Indice visuel baroque</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Diagonales et torsions</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Clair-obscur dramatique</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Sensation d’action en cours</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#be185d"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#be185d">Indice visuel classique</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Lignes stables</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Symétrie et hiérarchie</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Règles et mesure</text></svg>