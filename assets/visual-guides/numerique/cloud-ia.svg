<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Cloud, algorithme et intelligence artificielle</title><desc id="desc">Trois notions proches dans les usages, différentes dans leur nature</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#0f766e"/>
<circle cx="1080" cy="72" r="95" fill="#0f766e" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Cloud, algorithme et intelligence artificielle</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Trois notions proches dans les usages, différentes dans leur nature</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Cloud</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Ressources informatiques accessibles à</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">distance</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Stockage, calcul ou logiciel</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Les données restent sur des serveurs</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Algorithme</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Suite d’instructions finies</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Transforme des entrées en résultats</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Peut fonctionner sans IA</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">Intelligence artificielle</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Systèmes capables d’inférer à partir de</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">données</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Prédiction, classification ou génération</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Peut produire des erreurs</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">Réflexe critique</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Vérifier la source et la finalité</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Repérer biais et données personnelles</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Conserver une décision humaine</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">responsable</text></svg>