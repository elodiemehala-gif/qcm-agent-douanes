<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Cybermenaces : le bon réflexe</title><desc id="desc">Identifier le signal avant d’agir</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#0f766e"/>
<circle cx="1080" cy="72" r="95" fill="#0f766e" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Cybermenaces : le bon réflexe</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Identifier le signal avant d’agir</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Hameçonnage</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Message pressant ou lien suspect</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Ne pas cliquer</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Vérifier l’adresse par un autre canal</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Mot de passe</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Long et unique par service</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Gestionnaire recommandé</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Double authentification</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">Logiciel malveillant</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Pièce jointe ou programme piégé</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Mettre à jour et sauvegarder</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Isoler l’appareil en cas d’incident</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">Donnée sensible</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Limiter le partage</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Vérifier le destinataire</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Chiffrer si nécessaire</text></svg>