<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">RGPD : acteurs et droits</title><desc id="desc">Qui décide, qui traite, qui est protégée ?</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#0f766e"/>
<circle cx="1080" cy="72" r="95" fill="#0f766e" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">RGPD : acteurs et droits</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Qui décide, qui traite, qui est protégée ?</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Responsable du traitement</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Détermine les finalités et les moyens</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• doit justifier et sécuriser le traitement</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#0f766e">Sous-traitant</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Traite les données pour le responsable</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• agit selon ses instructions</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">Personne concernée</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Dispose de droits : accès, rectification,</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">effacement</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• opposition, limitation, portabilité selon</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">les cas</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#0f766e"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#0f766e">CNIL</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Informe et accompagne</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Contrôle</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Peut mettre en demeure et sanctionner</text></svg>