<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Suites : ordre de recherche</title><desc id="desc">Tester les règles simples avant les règles compliquées</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#4f46e5"/>
<circle cx="1080" cy="72" r="95" fill="#4f46e5" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Suites : ordre de recherche</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Tester les règles simples avant les règles compliquées</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#4f46e5"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#4f46e5">1. Différences</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Calculer les écarts entre termes</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Chercher une différence constante ou</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">progressive</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#4f46e5"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#4f46e5">2. Rapports</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Tester multiplications et divisions</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Repérer une proportion</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#4f46e5"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#4f46e5">3. Alternance</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Séparer rangs pairs et impairs</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Deux suites peuvent être entremêlées</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#4f46e5"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#4f46e5">4. Structure</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Carrés, cubes, nombres premiers</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Règle sur deux termes précédents</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Vérifier sur toute la suite</text></svg>