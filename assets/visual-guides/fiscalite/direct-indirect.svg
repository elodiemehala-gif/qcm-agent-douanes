<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Impôt direct ou indirect ?</title><desc id="desc">La distinction dépend du mode de perception</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#d97706"/>
<circle cx="1080" cy="72" r="95" fill="#d97706" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Impôt direct ou indirect ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">La distinction dépend du mode de perception</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Impôt direct</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Payé directement par le contribuable</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">désigné</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Établi à son nom</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemples : impôt sur le revenu, taxe</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Impôt indirect</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Prélevé lors d’une opération ou d’un</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">achat</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Collecté par un intermédiaire</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemple central : TVA</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Question réflexe</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Qui verse matériellement l’impôt ?</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Sur quel acte ou quelle base est-il</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">calculé ?</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Ne pas confondre avec</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Piège classique</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Direct ne veut pas dire progressif</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Indirect ne veut pas dire faible</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Deux classifications différentes</text></svg>