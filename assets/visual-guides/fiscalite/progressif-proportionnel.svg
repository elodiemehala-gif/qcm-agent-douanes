<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Progressif ou proportionnel ?</title><desc id="desc">Ici, on observe l’évolution du taux</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#d97706"/>
<circle cx="1080" cy="72" r="95" fill="#d97706" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Progressif ou proportionnel ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Ici, on observe l’évolution du taux</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Proportionnel</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Même taux quelle que soit la base</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Le montant augmente, mais pas le taux</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemple simple : 10 % pour tous</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Progressif</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Le taux augmente par tranches</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• La part prélevée croît avec le revenu</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemple : barème de l’impôt sur le revenu</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">À ne pas dire</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Progressif ≠ tout le revenu au taux</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">maximal</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Seule chaque tranche reçoit son taux</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Le taux marginal n’est pas le taux moyen</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Mémo</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Proportionnel = proportion constante</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Progressif = progression des taux</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Direct/indirect répond à une autre</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">question</text></svg>