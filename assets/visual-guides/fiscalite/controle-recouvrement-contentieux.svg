<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Contrôle, recouvrement, contentieux</title><desc id="desc">Trois moments différents de la relation fiscale</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#d97706"/>
<circle cx="1080" cy="72" r="95" fill="#d97706" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Contrôle, recouvrement, contentieux</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Trois moments différents de la relation fiscale</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Contrôle fiscal</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Vérifier la sincérité des déclarations</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Comparer les données disponibles</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Rectifier si nécessaire</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Recouvrement</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Faire entrer la somme due</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Spontané ou amiable d’abord</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Forcé en cas d’impayé</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Contentieux d’assiette</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Contestation de la base ou du calcul</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Question : combien est dû ?</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Contentieux du recouvrement</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Contestation des poursuites ou du</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">paiement</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Question : comment la somme est récupérée</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">?</text></svg>