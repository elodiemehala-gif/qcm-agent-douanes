<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">La chaîne fiscale</title><desc id="desc">De la base imposable jusqu’au paiement</desc>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/><rect width="18" height="820" rx="9" fill="#d97706"/>
<text x="62" y="82" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">La chaîne fiscale</text>
<text x="62" y="132" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">De la base imposable jusqu’au paiement</text>
<style>text{font-family:Inter,Arial,sans-serif}</style><circle cx="105" cy="253" r="31" fill="#d97706"/><text x="105" y="262" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">1</text><rect x="158" y="190" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="233" font-size="28" font-weight="820" fill="#d97706">Assiette</text><text x="190" y="269" font-size="21" font-weight="540" fill="#26344d">Déterminer ce qui est imposable · la base de calcul</text><path d="M105 320 V 334" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><path d="M96 326 L105 334 L114 326" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="402" r="31" fill="#d97706"/><text x="105" y="411" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">2</text><rect x="158" y="338" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="382" font-size="28" font-weight="820" fill="#d97706">Liquidation</text><text x="190" y="418" font-size="21" font-weight="540" fill="#26344d">Appliquer les règles et les taux · calculer la somme due</text><path d="M105 468 V 483" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><path d="M96 474 L105 483 L114 474" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="550" r="31" fill="#d97706"/><text x="105" y="559" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">3</text><rect x="158" y="487" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="530" font-size="28" font-weight="820" fill="#d97706">Recouvrement</text><text x="190" y="566" font-size="21" font-weight="540" fill="#26344d">Obtenir le paiement effectif · amiable puis, si besoin, forcé</text><path d="M105 616 V 632" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><path d="M96 622 L105 632 L114 622" fill="none" stroke="#d97706" stroke-width="5" 