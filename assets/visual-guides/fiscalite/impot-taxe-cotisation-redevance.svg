<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Prélèvements : ne plus les confondre</title><desc id="desc">Le mot-clé à repérer dans chaque définition</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#d97706"/>
<circle cx="1080" cy="72" r="95" fill="#d97706" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Prélèvements : ne plus les confondre</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Le mot-clé à repérer dans chaque définition</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Impôt</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Finance les charges publiques</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Pas de contrepartie directe</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">individualisée</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemple : impôt sur le revenu</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#d97706">Taxe</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Prélèvement lié à une situation ou un</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">service</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Le lien n’est pas forcément proportionnel</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">au service</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Cotisation sociale</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Finance la protection sociale</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Ouvre des droits sociaux</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Exemple : retraite, maladie</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#d97706"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#d97706">Redevance</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Paiement en échange d’un service rendu</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Montant lié à l’usage du service</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Logique de contrepartie directe</text></svg>