<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">La laïcité en quatre idées</title><desc id="desc">Liberté de conscience et neutralité de l’État</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#dc2626"/>
<circle cx="1080" cy="72" r="95" fill="#dc2626" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">La laïcité en quatre idées</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Liberté de conscience et neutralité de l’État</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#dc2626"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#dc2626">Liberté de conscience</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Croire, ne pas croire, changer de</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">conviction</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Liberté encadrée par l’ordre public</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#dc2626"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#dc2626">Neutralité de l’État</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Les services publics ne privilégient</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">aucun culte</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Les agents sont tenus à la neutralité</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#dc2626"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#dc2626">Égalité</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Même droit pour tous quelles que soient</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">les convictions</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Aucune religion d’État</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#dc2626"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#dc2626">Usagers et agents</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Les obligations ne sont pas identiques</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Agent : neutralité stricte</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Usager : liberté, sous limites légales</text></svg>