<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Aires et volumes : unités et formules</title><desc id="desc">Carré pour une surface, cube pour un volume</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#15803d"/>
<circle cx="1080" cy="72" r="95" fill="#15803d" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Aires et volumes : unités et formules</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Carré pour une surface, cube pour un volume</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#15803d"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#15803d">Aires</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Rectangle : L × l</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Triangle : b × h ÷ 2</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Disque : πr²</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#15803d"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#15803d">Volumes</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Pavé : L × l × h</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Cylindre : πr²h</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Toujours en unités cubiques</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#15803d"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#15803d">Échelle</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Longueur : coefficient n</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Aire : n²</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Volume : n³</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#15803d"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#15803d">Conversions</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• 1 m² = 10 000 cm²</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• 1 m³ = 1 000 L</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Ne pas appliquer la conversion linéaire</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">aux aires</text></svg>