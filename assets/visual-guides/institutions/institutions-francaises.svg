<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Les institutions françaises</title><desc id="desc">Qui décide, vote, exécute et contrôle ?</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#7c3aed"/>
<circle cx="1080" cy="72" r="95" fill="#7c3aed" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Les institutions françaises</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Qui décide, vote, exécute et contrôle ?</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">Président de la République</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Chef de l’État</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Nomme le Premier ministre</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Garant des institutions et de</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">l’indépendance nationale</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">Gouvernement</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Détermine et conduit la politique de la</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">Nation</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Dispose de l’administration</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Responsable devant l’Assemblée nationale</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">Parlement</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Assemblée nationale + Sénat</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Vote la loi</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Contrôle le Gouvernement et évalue les</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">politiques</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">Conseil constitutionnel</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Contrôle la conformité des lois à la</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">Constitution</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Juge certaines élections</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Traite les QPC</text></svg>