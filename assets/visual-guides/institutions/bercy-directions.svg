<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Bercy : qui fait quoi ?</title><desc id="desc">Le périmètre dépasse largement les seuls impôts</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#7c3aed"/>
<circle cx="1080" cy="72" r="95" fill="#7c3aed" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Bercy : qui fait quoi ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Le périmètre dépasse largement les seuls impôts</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">DGFiP</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Fiscalité générale</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Recouvrement et contrôle</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Comptes et gestion publics</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">DGDDI</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Flux de marchandises et frontières</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Droits de douane et contributions</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">indirectes</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Lutte contre les trafics</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">DGCCRF</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Concurrence</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Protection économique des consommateurs</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Lutte contre les fraudes commerciales</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">DG Trésor / Budget / Insee / AFT</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Politique économique / finances de l’État</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Statistique publique</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Gestion de la dette et de la trésorerie</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">de l’État</text></svg>