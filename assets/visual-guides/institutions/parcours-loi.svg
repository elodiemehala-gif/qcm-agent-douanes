<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Le parcours d’une loi</title><desc id="desc">De l’initiative à la promulgation</desc>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/><rect width="18" height="820" rx="9" fill="#7c3aed"/>
<text x="62" y="82" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Le parcours d’une loi</text>
<text x="62" y="132" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">De l’initiative à la promulgation</text>
<style>text{font-family:Inter,Arial,sans-serif}</style><circle cx="105" cy="253" r="31" fill="#7c3aed"/><text x="105" y="262" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">1</text><rect x="158" y="190" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="233" font-size="28" font-weight="820" fill="#7c3aed">Initiative</text><text x="190" y="269" font-size="21" font-weight="540" fill="#26344d">Projet de loi : Gouvernement · proposition de loi : parlementaire</text><path d="M105 320 V 334" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><path d="M96 326 L105 334 L114 326" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="402" r="31" fill="#7c3aed"/><text x="105" y="411" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">2</text><rect x="158" y="338" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="382" font-size="28" font-weight="820" fill="#7c3aed">Examen</text><text x="190" y="418" font-size="21" font-weight="540" fill="#26344d">Commission puis séance publique · amendements et vote</text><path d="M105 468 V 483" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><path d="M96 474 L105 483 L114 474" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="550" r="31" fill="#7c3aed"/><text x="105" y="559" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">3</text><rect x="158" y="487" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="530" font-size="28" font-weight="820" fill="#7c3aed">Navette</text><text x="190" y="566" font-size="21" font-weight="540" fill="#26344d">Assemblée nationale et Sénat examinent le texte · recherche d’un accord</text><path d="M105 616 V 632" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><path d="M96 622 L105 632 L114 622" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/><circle cx="105" cy="699" r="31" fill="#7c3aed"/><text x="105" y="708" text-anchor="middle" font-size="26" font-weight="850" fill="#fff">4</text><rect x="158" y="636" width="954" height="126" rx="22" fill="#fff" stroke="#dfe4ef" stroke-width="2"/><text x="190" y="678" font-size="28" font-weight="820" fill="#7c3aed">Adoption et promulgation</text><text x="190" y="714" font-size="21" font-weight="540" fill="#26344d">Contrôle constitutionnel éventuel · promulgation par le Président puis</text><text x="190" y="746" font-size="21" font-weight="540" fill="#26344d">publication</text></svg>