<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2030" viewBox="0 0 1200 2030" role="img" aria-labelledby="title desc">
  <title id="title">Organismes économiques et spécialisés : ne plus les confondre</title><desc id="desc">Comparaison du FMI, de la Banque mondiale, de l'OMC, de l'OCDE, de l'OPEP, de l'OMS et de la BCE.</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172133" flood-opacity=".10"/></filter></defs>
  <style>.bg{fill:#f7f8fc}.title{font:850 42px Inter,Arial,sans-serif;fill:#172133}.sub{font:520 21px Inter,Arial,sans-serif;fill:#516079}.card{fill:#fff;stroke:#dfe4ef;stroke-width:2;filter:url(#s)}.name{font:850 29px Inter,Arial,sans-serif}.type{font:800 14px Inter,Arial,sans-serif;letter-spacing:.4px}.label{font:760 17px Inter,Arial,sans-serif;fill:#273650}.body{font:520 18px Inter,Arial,sans-serif;fill:#42526a}.memo{font:760 19px Inter,Arial,sans-serif;fill:#273650}.small{font:500 14px Inter,Arial,sans-serif;fill:#667085}</style>
  <rect width="1200" height="2030" rx="32" class="bg"/><rect x="0" y="0" width="18" height="2030" rx="9" fill="#15956f"/>
  <text x="60" y="76" class="title">FMI, Banque mondiale, OMC… qui fait quoi ?</text><text x="60" y="116" class="sub">Même décor international, mais sept métiers complètement différents</text>

  <g transform="translate(60 160)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#2a8a70"/><text x="40" y="52" class="name" fill="#17634f">FMI</text><text x="130" y="49" class="type" fill="#17634f">FINANCE · 1944 · WASHINGTON</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Stabilité monétaire et financière ; prêts aux États en difficulté.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Crise de balance des paiements, programme d’aide, surveillance macroéconomique.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#d9f4eb"/><text x="885" y="187" class="memo" text-anchor="middle">« Urgence et stabilité »</text></g>

  <g transform="translate(60 410)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#3d79aa"/><text x="40" y="52" class="name" fill="#245c8a">Banque mondiale</text><text x="330" y="49" class="type" fill="#245c8a">DÉVELOPPEMENT · 1944 · WASHINGTON</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Financer des projets de long terme et réduire la pauvreté.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Écoles, santé, infrastructures, climat et développement d’un pays.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#dcecfb"/><text x="885" y="187" class="memo" text-anchor="middle">« Construire sur la durée »</text></g>

  <g transform="translate(60 660)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#7c3aed"/><text x="40" y="52" class="name" fill="#6840bd">OMC</text><text x="145" y="49" class="type" fill="#6840bd">COMMERCE · 1995 · GENÈVE</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Fixer le cadre des échanges commerciaux et régler les différends.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Droits de douane, accords commerciaux, conflit entre États sur le commerce.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#eee9ff"/><text x="885" y="187" class="memo" text-anchor="middle">« Les règles du commerce »</text></g>

  <g transform="translate(60 910)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#63758a"/><text x="40" y="52" class="name" fill="#45576d">OCDE</text><text x="165" y="49" class="type" fill="#45576d">ÉTUDES ET RECOMMANDATIONS · 1961 · PARIS</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Comparer les politiques publiques, produire des données et recommander des réformes.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Rapport PISA, fiscalité internationale, statistiques et « bonnes pratiques ».</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#e8edf3"/><text x="885" y="187" class="memo" text-anchor="middle">« Comparer et conseiller »</text></g>

  <g transform="translate(60 1160)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#c9782d"/><text x="40" y="52" class="name" fill="#985418">OPEP</text><text x="165" y="49" class="type" fill="#985418">PÉTROLE · 1960 · VIENNE</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Coordonner les politiques pétrolières de pays exportateurs.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Quotas de production, offre mondiale de pétrole et évolution des prix.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#ffead5"/><text x="885" y="187" class="memo" text-anchor="middle">« Le robinet du pétrole »</text></g>

  <g transform="translate(60 1410)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#d24b60"/><text x="40" y="52" class="name" fill="#a22f42">OMS</text><text x="145" y="49" class="type" fill="#a22f42">SANTÉ · 1948 · GENÈVE</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Diriger et coordonner l’action sanitaire internationale au sein de l’ONU.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Épidémie, normes sanitaires, vaccination et urgence de santé mondiale.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#ffe0e4"/><text x="885" y="187" class="memo" text-anchor="middle">« La santé mondiale »</text></g>

  <g transform="translate(60 1660)"><rect width="1080" height="226" rx="24" class="card"/><rect width="14" height="226" rx="7" fill="#2563eb"/><text x="40" y="52" class="name" fill="#174fba">BCE</text><text x="135" y="49" class="type" fill="#174fba">BANQUE CENTRALE · 1998 · FRANCFORT</text><text x="40" y="94" class="label">Mission :</text><text x="122" y="94" class="body">Conduire la politique monétaire de la zone euro et maintenir la stabilité des prix.</text><text x="40" y="130" class="label">Quand y penser ?</text><text x="175" y="130" class="body">Taux directeurs, inflation, euro et politique monétaire.</text><rect x="730" y="160" width="310" height="42" rx="21" fill="#e8f0ff"/><text x="885" y="187" class="memo" text-anchor="middle">« La monnaie euro »</text></g>

  <text x="60" y="1940" class="memo">Piège central : FMI = aide macroéconomique à court/moyen terme · Banque mondiale = développement de long terme</text><text x="60" y="1988" class="small">Sources officielles : FMI, Banque mondiale, OMC, OCDE, OPEP, OMS et BCE · repères vérifiés en septembre 2026.</text>
</svg>
