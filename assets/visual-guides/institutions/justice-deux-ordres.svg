<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Les deux ordres de juridiction</title><desc id="desc">Repérer le bon juge selon le litige</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#7c3aed"/>
<circle cx="1080" cy="72" r="95" fill="#7c3aed" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Les deux ordres de juridiction</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Repérer le bon juge selon le litige</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">Ordre judiciaire</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Litiges entre personnes privées</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Infractions pénales</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Sommet : Cour de cassation</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#7c3aed">Ordre administratif</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Litiges impliquant l’administration dans</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">l’exercice de ses prérogatives</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Sommet : Conseil d’État</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">Tribunal des conflits</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Règle les conflits de compétence</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Évite un déni de justice</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Détermine l’ordre compétent</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#7c3aed"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#7c3aed">Ne pas confondre</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Conseil constitutionnel ≠ troisième ordre</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Cour de cassation ne rejuge pas tous les</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">faits</text><text x="645" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Conseil d’État a aussi un rôle</text></svg>