<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1780" viewBox="0 0 1200 1780" role="img" aria-labelledby="title desc">
  <title id="title">Organisations et forums politiques : ne plus les confondre</title><desc id="desc">Comparaison de l'ONU, l'OTAN, l'Union européenne, le G7, le G20 et les BRICS.</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172133" flood-opacity=".10"/></filter></defs>
  <style>.bg{fill:#f7f8fc}.title{font:850 42px Inter,Arial,sans-serif;fill:#172133}.sub{font:520 21px Inter,Arial,sans-serif;fill:#516079}.card{fill:#fff;stroke:#dfe4ef;stroke-width:2;filter:url(#s)}.name{font:850 30px Inter,Arial,sans-serif}.type{font:800 14px Inter,Arial,sans-serif;letter-spacing:.5px}.label{font:760 17px Inter,Arial,sans-serif;fill:#273650}.body{font:520 18px Inter,Arial,sans-serif;fill:#42526a}.memo{font:760 19px Inter,Arial,sans-serif;fill:#273650}.small{font:500 14px Inter,Arial,sans-serif;fill:#667085}</style>
  <rect width="1200" height="1780" rx="32" class="bg"/><rect x="0" y="0" width="18" height="1780" rx="9" fill="#7c3aed"/>
  <text x="60" y="76" class="title">ONU, OTAN, UE, G7, G20 ou BRICS ?</text><text x="60" y="116" class="sub">Commence par identifier la nature de l’organisme : c’est le meilleur raccourci</text>

  <g transform="translate(60 165)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#7657ad"/><text x="40" y="52" class="name" fill="#5b3a91">ONU</text><text x="165" y="49" class="type" fill="#5b3a91">ORGANISATION MONDIALE · 1945 · NEW YORK</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">193 États membres : presque tous les pays du monde.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Paix, sécurité, droits humains, développement et coopération.</text><text x="40" y="164" class="label">Pouvoir clé :</text><text x="158" y="164" class="body">Conseil de sécurité ; cadre juridique fondé sur la Charte.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#eee9ff"/><text x="900" y="177" class="memo" text-anchor="middle">« Le monde discute »</text></g>

  <g transform="translate(60 410)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#bd4056"/><text x="40" y="52" class="name" fill="#a22f42">OTAN</text><text x="165" y="49" class="type" fill="#a22f42">ALLIANCE MILITAIRE · 1949 · BRUXELLES</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">32 États d’Europe et d’Amérique du Nord.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Défendre collectivement ses membres par des moyens politiques et militaires.</text><text x="40" y="164" class="label">Pouvoir clé :</text><text x="158" y="164" class="body">Article 5 : une attaque contre un allié concerne tous les autres.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#ffe0e4"/><text x="900" y="177" class="memo" text-anchor="middle">« Les alliés se défendent »</text></g>

  <g transform="translate(60 655)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#3d79aa"/><text x="40" y="52" class="name" fill="#245c8a">Union européenne</text><text x="330" y="49" class="type" fill="#245c8a">UNION SUPRANATIONALE · 1951→1993 · BRUXELLES</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">27 États européens ; certaines compétences sont exercées en commun.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Marché unique, politiques communes, droit européen ; euro pour une partie des membres.</text><text x="40" y="164" class="label">Pouvoir clé :</text><text x="158" y="164" class="body">Peut adopter des actes juridiques obligatoires dans ses compétences.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#dcecfb"/><text x="900" y="177" class="memo" text-anchor="middle">« Les Européens décident »</text></g>

  <g transform="translate(60 900)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#63758a"/><text x="40" y="52" class="name" fill="#45576d">G7</text><text x="125" y="49" class="type" fill="#45576d">FORUM INFORMEL · 1975/1976 · PAS DE SIÈGE</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">7 démocraties industrialisées + participation de l’Union européenne.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Coordonner des positions économiques, diplomatiques et stratégiques.</text><text x="40" y="164" class="label">Limite :</text><text x="115" y="164" class="body">Pas de traité, pas de loi mondiale, pas d’armée ni de secrétariat permanent.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#e8edf3"/><text x="900" y="177" class="memo" text-anchor="middle">« Les 7 se concertent »</text></g>

  <g transform="translate(60 1145)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#2a8a70"/><text x="40" y="52" class="name" fill="#17634f">G20</text><text x="145" y="49" class="type" fill="#17634f">FORUM ÉCONOMIQUE · 1999 · PAS DE SIÈGE</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">19 pays + Union européenne + Union africaine.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Coopération économique mondiale et stabilité financière.</text><text x="40" y="164" class="label">Différence :</text><text x="145" y="164" class="body">Plus large et plus représentatif des économies émergentes que le G7.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#d9f4eb"/><text x="900" y="177" class="memo" text-anchor="middle">« L’économie au sens large »</text></g>

  <g transform="translate(60 1390)"><rect width="1080" height="220" rx="24" class="card"/><rect width="14" height="220" rx="7" fill="#c9782d"/><text x="40" y="52" class="name" fill="#985418">BRICS</text><text x="170" y="49" class="type" fill="#985418">GROUPE DE PUISSANCES ÉMERGENTES · 2006→2009</text><text x="40" y="94" class="label">Qui ?</text><text x="112" y="94" class="body">Grandes puissances émergentes ; composition élargie depuis 2024–2025.</text><text x="40" y="128" class="label">À quoi ça sert ?</text><text x="180" y="128" class="body">Renforcer leur coopération et leur poids dans la gouvernance mondiale.</text><text x="40" y="164" class="label">Limite :</text><text x="115" y="164" class="body">Ce n’est ni l’OTAN du « Sud » ni une union supranationale comparable à l’UE.</text><rect x="760" y="150" width="280" height="42" rx="21" fill="#ffead5"/><text x="900" y="177" class="memo" text-anchor="middle">« Les émergents pèsent »</text></g>

  <text x="60" y="1662" class="memo">Réflexe concours : sécurité mondiale → ONU · défense d’alliés → OTAN · décision européenne → UE</text><text x="60" y="1696" class="memo">concertation des 7 → G7 · économie mondiale élargie → G20 · puissances émergentes → BRICS</text><text x="60" y="1748" class="small">Repères vérifiés en septembre 2026 · les effectifs peuvent évoluer : la nature et la mission restent les indices les plus fiables.</text>
</svg>
