<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2520" viewBox="0 0 1200 2520" role="img" aria-labelledby="title desc">
  <title id="title">Bercy : dates de création et grandes transformations</title>
  <desc id="desc">Frise des principales dates de la DGDDI, de l'Insee, de la DGCCRF, de Tracfin, de l'Agence France Trésor, de la direction générale du Trésor et de la DGFiP.</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172133" flood-opacity=".11"/></filter></defs>
  <style>
    .bg{fill:#f7f8fc}.head{fill:#172133}.title{font:850 43px Inter,Arial,sans-serif}.sub{font:520 22px Inter,Arial,sans-serif;fill:#516079}.line{stroke:#cfd7e6;stroke-width:8;stroke-linecap:round}.card{fill:#fff;stroke:#dfe4ef;stroke-width:2;filter:url(#shadow)}
    .year{font:850 25px Inter,Arial,sans-serif;fill:#172133;text-anchor:end}.name{font:820 27px Inter,Arial,sans-serif;fill:#172133}.body{font:520 20px Inter,Arial,sans-serif;fill:#334155}.strong{font:730 20px Inter,Arial,sans-serif;fill:#26344d}.tag{font:800 13px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:middle;letter-spacing:.5px}.small{font:500 15px Inter,Arial,sans-serif;fill:#667085}.memo{font:760 20px Inter,Arial,sans-serif;fill:#273650}
    .create{fill:#e8e2ff}.createT{fill:#6840bd}.change{fill:#dff3ff}.changeT{fill:#17658c}.transfer{fill:#e3f6ec}.transferT{fill:#18704c}
  </style>
  <rect width="1200" height="2520" rx="32" class="bg"/><rect x="0" y="0" width="18" height="2520" rx="9" fill="#7c3aed"/>
  <text x="60" y="78" class="title head">Bercy : qui apparaît quand ?</text>
  <text x="60" y="118" class="sub">Créations, fusions et transferts de missions — les dates vraiment utiles</text>
  <g transform="translate(60 148)"><rect width="150" height="34" rx="17" class="create"/><text x="75" y="17" class="tag createT">CRÉATION</text><rect x="166" width="186" height="34" rx="17" class="change"/><text x="259" y="17" class="tag changeT">RÉORGANISATION</text><rect x="368" width="213" height="34" rx="17" class="transfer"/><text x="474.5" y="17" class="tag transferT">TRANSFERT DE MISSION</text></g>
  <line x1="174" y1="235" x2="174" y2="2190" class="line"/>

  <text x="132" y="275" class="year">1791</text><circle cx="174" cy="268" r="16" fill="#7c3aed"/><rect x="222" y="215" width="918" height="110" rx="22" class="card"/><rect x="248" y="237" width="120" height="28" rx="14" class="create"/><text x="308" y="251" class="tag createT">CRÉATION</text><text x="390" y="258" class="name">Douane moderne — future DGDDI</text><text x="248" y="298" class="body">1er mai : naissance de la Régie nationale des douanes après la Révolution.</text>

  <text x="132" y="430" class="year">1946</text><circle cx="174" cy="423" r="16" fill="#7c3aed"/><rect x="222" y="370" width="918" height="110" rx="22" class="card"/><rect x="248" y="392" width="120" height="28" rx="14" class="create"/><text x="308" y="406" class="tag createT">CRÉATION</text><text x="390" y="413" class="name">Insee</text><text x="248" y="453" class="body">27 avril : création de l’Institut national de la statistique et des études économiques.</text>

  <text x="132" y="585" class="year">1985–86</text><circle cx="174" cy="578" r="16" fill="#7c3aed"/><rect x="222" y="525" width="918" height="110" rx="22" class="card"/><rect x="248" y="547" width="120" height="28" rx="14" class="create"/><text x="308" y="561" class="tag createT">CRÉATION</text><text x="390" y="568" class="name">DGCCRF</text><text x="248" y="608" class="body">Regroupement de la concurrence, de la consommation et de la répression des fraudes.</text>

  <text x="132" y="740" class="year">1990</text><circle cx="174" cy="733" r="16" fill="#7c3aed"/><rect x="222" y="680" width="918" height="110" rx="22" class="card"/><rect x="248" y="702" width="120" height="28" rx="14" class="create"/><text x="308" y="716" class="tag createT">CRÉATION</text><text x="390" y="723" class="name">Tracfin</text><text x="248" y="763" class="body">9 mai : création de la cellule contre les circuits financiers clandestins.</text>

  <text x="132" y="895" class="year">1993</text><circle cx="174" cy="888" r="16" fill="#2795c5"/><rect x="222" y="835" width="918" height="110" rx="22" class="card"/><rect x="248" y="857" width="186" height="28" rx="14" class="change"/><text x="341" y="871" class="tag changeT">MISSION MODIFIÉE</text><text x="458" y="878" class="name">Douane et marché unique</text><text x="248" y="918" class="body">Suppression des formalités douanières aux frontières intérieures de l’Union européenne.</text>

  <text x="132" y="1050" class="year">2001</text><circle cx="174" cy="1043" r="16" fill="#7c3aed"/><rect x="222" y="990" width="918" height="110" rx="22" class="card"/><rect x="248" y="1012" width="120" height="28" rx="14" class="create"/><text x="308" y="1026" class="tag createT">CRÉATION</text><text x="390" y="1033" class="name">Agence France Trésor (AFT)</text><text x="248" y="1073" class="body">8 février : agence chargée de la dette et de la trésorerie de l’État.</text>

  <text x="132" y="1205" class="year">2004</text><circle cx="174" cy="1198" r="16" fill="#7c3aed"/><rect x="222" y="1145" width="918" height="110" rx="22" class="card"/><rect x="248" y="1167" width="120" height="28" rx="14" class="create"/><text x="308" y="1181" class="tag createT">CRÉATION</text><text x="390" y="1188" class="name">DGTPE</text><text x="248" y="1228" class="body">15 novembre : création de la direction générale du Trésor et de la politique économique.</text>

  <text x="132" y="1360" class="year">2006</text><circle cx="174" cy="1353" r="16" fill="#2795c5"/><rect x="222" y="1300" width="918" height="110" rx="22" class="card"/><rect x="248" y="1322" width="186" height="28" rx="14" class="change"/><text x="341" y="1336" class="tag changeT">RÉORGANISATION</text><text x="458" y="1343" class="name">Tracfin devient un SCN</text><text x="248" y="1383" class="body">6 décembre : la cellule devient un service à compétence nationale.</text>

  <text x="132" y="1515" class="year">2008</text><circle cx="174" cy="1508" r="16" fill="#7c3aed"/><rect x="222" y="1455" width="918" height="110" rx="22" class="card"/><rect x="248" y="1477" width="120" height="28" rx="14" class="create"/><text x="308" y="1491" class="tag createT">FUSION</text><text x="390" y="1498" class="name">DGFiP = DGI + DGCP</text><text x="248" y="1538" class="body">3 avril : les Impôts et la Comptabilité publique fusionnent en une direction unique.</text>

  <text x="132" y="1670" class="year">2009–11</text><circle cx="174" cy="1663" r="16" fill="#2795c5"/><rect x="222" y="1610" width="918" height="110" rx="22" class="card"/><rect x="248" y="1632" width="186" height="28" rx="14" class="change"/><text x="341" y="1646" class="tag changeT">RÉORGANISATION</text><text x="458" y="1653" class="name">Réseau territorial de la DGFiP</text><text x="248" y="1693" class="body">Création progressive des DRFiP/DDFiP et des services des impôts des particuliers.</text>

  <text x="132" y="1825" class="year">2010</text><circle cx="174" cy="1818" r="16" fill="#2795c5"/><rect x="222" y="1765" width="918" height="110" rx="22" class="card"/><rect x="248" y="1787" width="186" height="28" rx="14" class="change"/><text x="341" y="1801" class="tag changeT">CHANGEMENT DE NOM</text><text x="458" y="1808" class="name">DGTPE → DG Trésor</text><text x="248" y="1848" class="body">18 mars : la direction prend son nom actuel, « direction générale du Trésor ».</text>

  <text x="132" y="1980" class="year">2010→21</text><circle cx="174" cy="1973" r="16" fill="#2795c5"/><rect x="222" y="1920" width="918" height="110" rx="22" class="card"/><rect x="248" y="1942" width="186" height="28" rx="14" class="change"/><text x="341" y="1956" class="tag changeT">RÉSEAU DGCCRF</text><text x="458" y="1963" class="name">DIRECCTE puis DREETS</text><text x="248" y="2003" class="body">Les enquêtes sont pilotées en région ; les DDPP/DDETSPP agissent au niveau départemental.</text>

  <text x="132" y="2135" class="year">2022</text><circle cx="174" cy="2128" r="16" fill="#2a9b68"/><rect x="222" y="2075" width="918" height="110" rx="22" class="card"/><rect x="248" y="2097" width="213" height="28" rx="14" class="transfer"/><text x="354.5" y="2111" class="tag transferT">DGDDI → DGFIP</text><text x="485" y="2118" class="name">TVA à l’importation</text><text x="248" y="2158" class="body">La gestion et le recouvrement de la TVA à l’importation passent à la DGFiP.</text>

  <text x="132" y="2290" class="year">2024</text><circle cx="174" cy="2283" r="16" fill="#2a9b68"/><rect x="222" y="2230" width="918" height="110" rx="22" class="card"/><rect x="248" y="2252" width="213" height="28" rx="14" class="transfer"/><text x="354.5" y="2266" class="tag transferT">DGDDI → DGFIP</text><text x="485" y="2273" class="name">Contributions indirectes</text><text x="248" y="2313" class="body">Le recouvrement sur alcools, boissons alcooliques et tabacs est transféré à la DGFiP.</text>

  <rect x="60" y="2380" width="1080" height="92" rx="20" fill="#eee9ff"/><text x="86" y="2416" class="memo">Mémo : DGFiP = fusion fiscale · DGDDI = frontière/marchandise · DGCCRF = marché/consommateur</text><text x="86" y="2448" class="small">Sources : DGFiP, DGCCRF, DGDDI, Insee, Tracfin et Légifrance · repères vérifiés en septembre 2026.</text>
</svg>
