<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Les agents économiques</title><desc id="desc">Qui produit, consomme, finance ou redistribue ?</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#2563eb"/>
<circle cx="1080" cy="72" r="95" fill="#2563eb" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Les agents économiques</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Qui produit, consomme, finance ou redistribue ?</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Ménages</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Consomment</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Fournissent du travail</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Épargnent et paient des prélèvements</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Entreprises</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Produisent des biens et services</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">marchands</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Investissent et emploient</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Versent salaires et prélèvements</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Administrations publiques</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Produisent des services non marchands</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Prélèvent et redistribuent</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Mènent des politiques publiques</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Institutions financières</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Collectent l’épargne</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Accordent des financements</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Fournissent des moyens de paiement</text></svg>