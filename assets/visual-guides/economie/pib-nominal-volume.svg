<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">PIB nominal ou PIB en volume ?</title><desc id="desc">Séparer l’effet des prix de l’effet des quantités</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#2563eb"/>
<circle cx="1080" cy="72" r="95" fill="#2563eb" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">PIB nominal ou PIB en volume ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Séparer l’effet des prix de l’effet des quantités</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">PIB nominal</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Calculé aux prix courants</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Peut augmenter à cause de l’inflation</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Mélange prix et quantités</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">PIB en volume</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Corrigé de l’évolution des prix</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Mesure mieux la production réelle</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Sert à calculer la croissance</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Exemple</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Quantités inchangées, prix +5 %</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• PIB nominal : environ +5 %</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• PIB en volume : environ 0 %</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Réflexe QCM</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Croissance économique → PIB en volume</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Taille monétaire courante → PIB nominal</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Toujours regarder l’unité et la période</text></svg>