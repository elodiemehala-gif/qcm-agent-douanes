<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Déficit public ou dette publique ?</title><desc id="desc">Le déficit est un flux ; la dette est un stock</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#2563eb"/>
<circle cx="1080" cy="72" r="95" fill="#2563eb" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Déficit public ou dette publique ?</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Le déficit est un flux ; la dette est un stock</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Déficit public</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Dépenses publiques &gt; recettes sur une</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">année</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Se mesure sur une période</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Flux annuel</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Dette publique</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Accumulation d’emprunts restant à</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">rembourser</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Se mesure à une date</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Stock</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Lien</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Un déficit nouveau accroît généralement</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">la dette</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Un excédent peut la réduire</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Les intérêts pèsent sur les dépenses</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Mémo</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Déficit = film de l’année</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Dette = photo à une date</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Les deux peuvent être rapportés au PIB</text></svg>