<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">PIB : ce qu’il mesure vraiment</title><desc id="desc">Un flux de production créé sur un territoire</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#2563eb"/>
<circle cx="1080" cy="72" r="95" fill="#2563eb" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">PIB : ce qu’il mesure vraiment</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Un flux de production créé sur un territoire</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Définition</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Valeur des biens et services finaux</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">produits</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Sur un territoire</text><text x="94" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Pendant une période donnée</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Approche production</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Somme des valeurs ajoutées</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• + impôts sur les produits</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• − subventions sur les produits</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Ce que le PIB n’est pas</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Pas un stock de patrimoine</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Pas le chiffre d’affaires total</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Pas une mesure complète du bien-être</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">PIB par habitant</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• PIB ÷ population</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Indicateur moyen</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Ne décrit pas les inégalités de revenu</text></svg>