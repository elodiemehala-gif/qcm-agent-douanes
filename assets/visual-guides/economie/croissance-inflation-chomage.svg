<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Croissance, inflation, chômage</title><desc id="desc">Trois indicateurs, trois phénomènes différents</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="820" rx="34" fill="#f7f8fc"/>
<rect x="0" y="0" width="18" height="820" rx="9" fill="#2563eb"/>
<circle cx="1080" cy="72" r="95" fill="#2563eb" opacity=".09"/>
<text x="62" y="82" class="head" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="850" fill="#14213d">Croissance, inflation, chômage</text>
<text x="62" y="132" class="body" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="520" fill="#516079">Trois indicateurs, trois phénomènes différents</text>
<style>.head,.body{font-family:Inter,Arial,sans-serif} .body{dominant-baseline:auto}</style><rect x="62" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Croissance</text><text x="94" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Hausse du PIB en volume</text><text x="94" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Mesure l’évolution de la production</text><text x="94" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">• Peut être positive, nulle ou négative</text><rect x="613" y="190" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="190" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="238" class="head" font-size="29" font-weight="800" fill="#2563eb">Inflation</text><text x="645" y="282" class="body" font-size="23" font-weight="540" fill="#26344d">• Hausse générale et durable des prix</text><text x="645" y="321" class="body" font-size="23" font-weight="540" fill="#26344d">• Réduit le pouvoir d’achat à revenu</text><text x="645" y="360" class="body" font-size="23" font-weight="540" fill="#26344d">inchangé</text><text x="645" y="399" class="body" font-size="23" font-weight="540" fill="#26344d">• Mesurée notamment par un indice des prix</text><rect x="62" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="62" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="92" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Chômage</text><text x="94" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Part des actifs sans emploi qui en</text><text x="94" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">recherchent un</text><text x="94" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Ne se confond pas avec l’inactivité</text><text x="94" y="699" class="body" font-size="23" font-weight="540" fill="#26344d">• Taux = chômeurs ÷ population active</text><rect x="613" y="490" width="525" height="274" rx="24" fill="#ffffff" stroke="#dfe4ef" stroke-width="2" filter="url(#shadow)"/><rect x="613" y="490" width="10" height="274" rx="5" fill="#2563eb"/><text x="643" y="538" class="head" font-size="29" font-weight="800" fill="#2563eb">Attention</text><text x="645" y="582" class="body" font-size="23" font-weight="540" fill="#26344d">• Inflation ≠ hausse d’un seul prix</text><text x="645" y="621" class="body" font-size="23" font-weight="540" fill="#26344d">• Croissance nominale ≠ croissance réelle</text><text x="645" y="660" class="body" font-size="23" font-weight="540" fill="#26344d">• Population active ≠ population totale</text></svg>