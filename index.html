<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>QCM Agent / Douanes</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#6b7484;--line:#dfe4ec;--blue:#235ee7;--ok:#13845d;--bad:#c33c43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 16px}.top b{font-size:17px}.top small{display:block;color:var(--muted)}main{max-width:900px;margin:auto;padding:18px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:10px 0}.hero h1{margin:0 0 8px;font-size:26px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{cursor:pointer}.cat b{display:block;margin-bottom:5px}.bar{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--blue)}button,select,input{font:inherit}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}.opt{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;cursor:pointer}.opt.correct{border-color:var(--ok);background:#edf9f4}.opt.wrong{border-color:var(--bad);background:#fff0f1}.feedback{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.ok{color:var(--ok)}.ko{color:var(--bad)}.row{font-size:13px}.row code{color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#fff;border-top:1px solid var(--line);padding:8px}.nav button{border:0;background:transparent;padding:9px 13px;color:var(--muted);cursor:pointer}.nav button.on{color:var(--blue);font-weight:700}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.stat{font-size:28px;font-weight:800}.tag{display:inline-block;background:#eef3ff;color:#174dbf;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.load{display:flex;align-items:center;gap:10px}.dot{width:12px;height:12px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(max-width:650px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style>
</head>
<body>
<header class="top"><b>QCM Agent / Douanes</b><small>8 matières · couverture de toutes les informations extraites</small></header>
<main id="app"><div class="card load"><span class="dot"></span><span>Chargement de la banque QCM…</span></div></main>
<nav class="nav"><button data-r="home" class="on">Accueil</button><button data-r="quiz">Réviser</button><button data-r="inventory">Inventaire</button><button data-r="stats">Stats</button></nav>
<script>
(async()=>{
  const app=document.querySelector('#app');
  const parts=[];
  for(let i=1;i<=12;i++){
    const name=`bank-${String(i).padStart(2,'0')}.txt`;
    const r=await fetch(name,{cache:'no-store'});
    if(!r.ok) throw new Error(`Fichier manquant : ${name} (${r.status})`);
    parts.push((await r.text()).trim());
  }
  if(typeof DecompressionStream==='undefined') throw new Error('Ce navigateur ne prend pas en charge la décompression nécessaire. Mets Chrome à jour puis recharge.');
  const b64=parts.join('');
  let bin;
  try{bin=atob(b64)}catch(e){throw new Error('La banque QCM est incomplète ou corrompue (base64).')}
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  let payload;
  try{
    const txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    payload=JSON.parse(txt);
  }catch(e){throw new Error('Impossible de décompresser ou lire la banque QCM.')}
  if(!payload || !Array.isArray(payload.c) || !Array.isArray(payload.k)) throw new Error('Format de banque QCM invalide.');

  const cats=payload.c;
  const prefixes=['HIS','GEO','EMC','ACT','ORG','MAT','LOG','CG'];
  const counts=Array(cats.length).fill(0);
  const K=payload.k.map(([ci,page,text])=>({ci,page,text,cat:cats[ci],id:`${prefixes[ci]||'Q'}-${String(++counts[ci]).padStart(4,'0')}`}));
  const KEY='qcm-agent-douanes-v4';
  let P={};
  try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{P={}}
  let route='home',selected=new Set(cats),mode='coverage',size=20,session=[],qi=0;
  const save=()=>localStorage.setItem(KEY,JSON.stringify(P));
  const rec=id=>P[id]||(P[id]={a:0,c:0,w:0,s:0});
  const status=id=>{const r=P[id];return !r||!r.a?'new':r.s>=2&&r.c>=2?'mastered':r.w&&r.s===0?'error':'seen'};
  const pct=(a,b)=>b?Math.round(a*100/b):0;
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const rank={new:0,error:1,seen:2,mastered:3};

  function cs(c){const a=K.filter(x=>x.cat===c);let seen=0,m=0,e=0;a.forEach(x=>{const s=status(x.id);if(s!=='new')seen++;if(s==='mastered')m++;if(s==='error')e++});return{t:a.length,seen,m,e}}
  function go(r){route=r;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));render()}
  function home(){const seen=K.filter(x=>status(x.id)!=='new').length,m=K.filter(x=>status(x.id)==='mastered').length;app.innerHTML=`<div class="card hero"><h1>Réviser sans laisser de trous</h1><p class="muted">Chaque information extraite des 8 cours peut apparaître dans une question. Le mode Couverture commence par celles que tu n'as jamais rencontrées.</p><span class="tag">Couverture documentaire : 100 %</span><div class="actions"><button class="btn" id="cov">Continuer la couverture</button><button class="btn alt" id="err">Réviser mes erreurs</button></div></div><div class="card"><div class="stat">${pct(seen,K.length)} %</div><div class="muted">${seen} / ${K.length} informations rencontrées · ${m} maîtrisées</div><div class="bar"><i style="width:${pct(seen,K.length)}%"></i></div><span class="tag">Actualité figée au 31 août 2026</span></div><h2>Les 8 matières</h2><div class="grid">${cats.map(c=>{const s=cs(c);return`<div class="card cat" data-cat="${esc(c)}"><b>${esc(c)}</b><span class="muted">${s.t} informations · ${s.e} à revoir</span><div class="bar"><i style="width:${pct(s.seen,s.t)}%"></i></div><small>${s.seen}/${s.t} vues · ${s.m} maîtrisées</small></div>`}).join('')}</div>`;document.querySelector('#cov').onclick=()=>{mode='coverage';go('quiz')};document.querySelector('#err').onclick=()=>{mode='errors';go('quiz')};document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{selected=new Set([x.dataset.cat]);mode='coverage';go('quiz')})}
  function quiz(){app.innerHTML=`<h2>Nouvelle session</h2><div class="card"><b>Mode</b><div class="chips" style="margin-top:9px">${[['coverage','Couverture 100 %'],['errors','Erreurs'],['random','Aléatoire']].map(([v,l])=>`<button class="chip ${mode===v?'on':''}" data-m="${v}">${l}</button>`).join('')}</div></div><div class="card"><b>Matières</b><div class="chips" style="margin-top:9px">${cats.map(c=>`<button class="chip ${selected.has(c)?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="card"><b>Nombre de questions</b><select id="sz" class="field" style="margin-top:9px"><option ${size===10?'selected':''}>10</option><option ${size===20?'selected':''}>20</option><option ${size===50?'selected':''}>50</option><option ${size===100?'selected':''}>100</option></select></div><button id="launch" class="btn" style="width:100%">Lancer la session</button>`;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;quiz()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(selected.has(c)&&selected.size>1)selected.delete(c);else selected.add(c);quiz()});document.querySelector('#sz').onchange=e=>size=+e.target.value;document.querySelector('#launch').onclick=start}
  function makeQ(x){const pool=K.filter(y=>y.ci===x.ci&&y.id!==x.id&&y.text!==x.text);const distractors=shuffle(pool).slice(0,3).map(y=>y.text);const opts=shuffle([x.text,...distractors]);return{x,opts,ans:opts.indexOf(x.text)}}
  function start(){let a=K.filter(x=>selected.has(x.cat));if(mode==='errors')a=a.filter(x=>P[x.id]?.w);if(mode==='coverage'){a.sort((x,y)=>rank[status(x.id)]-rank[status(y.id)]||(P[x.id]?.a||0)-(P[y.id]?.a||0)||Math.random()-.5)}else{a=shuffle(a)}session=a.slice(0,size).map(makeQ);qi=0;if(!session.length){app.innerHTML='<div class="card">Aucune question ne correspond à ce filtre.</div>';return}show()}
  function show(){const q=session[qi];app.innerHTML=`<div class="muted">${esc(q.x.cat)} · ${qi+1}/${session.length} · ${q.x.id}</div><div class="bar"><i style="width:${pct(qi,session.length)}%"></i></div><div class="card"><h2>Quelle affirmation est correcte ?</h2>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}<div id="fb"></div></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i))}
  function answer(q,i){const ok=i===q.ans,r=rec(q.x.id);r.a++;if(ok){r.c++;r.s++}else{r.w++;r.s=0}save();document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.querySelector('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}"><b>${ok?'Bonne réponse':'À revoir'}</b><p>${esc(q.x.text)}</p><small>Source : cours · page ${q.x.page}</small><div class="actions"><button class="btn" id="next">${qi+1<session.length?'Question suivante':'Bilan'}</button></div></div>`;document.querySelector('#next').onclick=()=>{qi++;qi<session.length?show():end()}}
  function end(){const ids=session.map(q=>q.x.id),m=ids.filter(id=>status(id)==='mastered').length,e=ids.filter(id=>status(id)==='error').length;app.innerHTML=`<div class="card hero"><h1>Session terminée</h1><p>${ids.length} informations travaillées · ${m} maîtrisées · ${e} à revoir.</p><div class="actions"><button class="btn" id="again">Nouvelle session</button><button class="btn alt" id="back">Accueil</button></div></div>`;document.querySelector('#again').onclick=quiz;document.querySelector('#back').onclick=()=>go('home')}
  function inventory(){app.innerHTML=`<h2>Inventaire — ${K.length} informations</h2><div class="filters"><input id="q" class="field" placeholder="Rechercher"><select id="cf" class="field"><option value="">Toutes</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="sf" class="field"><option value="">Tous statuts</option><option value="new">Jamais vue</option><option value="seen">Vue</option><option value="error">À revoir</option><option value="mastered">Maîtrisée</option></select></div><div id="list"></div>`;['q','cf','sf'].forEach(id=>document.querySelector('#'+id).oninput=list);list()}
  function list(){const q=(document.querySelector('#q')?.value||'').toLowerCase(),c=document.querySelector('#cf')?.value||'',s=document.querySelector('#sf')?.value||'';const a=K.filter(x=>(!c||x.cat===c)&&(!s||status(x.id)===s)&&(!q||x.text.toLowerCase().includes(q))).slice(0,300);document.querySelector('#list').innerHTML=a.map(x=>`<div class="card row"><code>${x.id} · ${esc(x.cat)} · p.${x.page} · ${status(x.id)}</code><p>${esc(x.text)}</p></div>`).join('')||'<div class="card">Aucun résultat.</div>'}
  function stats(){const seen=K.filter(x=>status(x.id)!=='new').length,m=K.filter(x=>status(x.id)==='mastered').length,e=K.filter(x=>status(x.id)==='error').length;app.innerHTML=`<h2>Progression</h2><div class="grid"><div class="card"><div class="stat">${pct(seen,K.length)} %</div><span class="muted">couverture personnelle</span></div><div class="card"><div class="stat">${m}</div><span class="muted">maîtrisées</span></div><div class="card"><div class="stat">${e}</div><span class="muted">à revoir</span></div><div class="card"><div class="stat">100 %</div><span class="muted">couverture documentaire</span></div></div><div class="actions"><button class="btn bad" id="reset">Réinitialiser</button></div>`;document.querySelector('#reset').onclick=()=>{if(confirm('Effacer toute la progression ?')){P={};save();stats()}}}
  function render(){if(route==='home')home();else if(route==='quiz')quiz();else if(route==='inventory')inventory();else stats()}
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.r));
  render();
})().catch(e=>{const app=document.querySelector('#app');app.innerHTML=`<div class="card"><h2>Impossible de charger l’application</h2><p>${String(e.message||e)}</p><p class="muted">Recharge la page. Si le message persiste, envoie-moi une capture.</p></div>`;console.error(e)});
</script>
</body>
</html>
