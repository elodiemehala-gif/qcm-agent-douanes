<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>QCM Agent / Douanes</title><style>:root{--bg:#f3f6fb;--card:#fff;--text:#142033;--muted:#68758a;--line:#dfe6ef;--accent:#1e5eff;--accent2:#123ca4;--good:#16865b;--bad:#c73939;--warn:#b36b00;--shadow:0 8px 30px rgba(26,43,72,.08)}
[data-theme="dark"]{--bg:#0d1420;--card:#151f2f;--text:#eef4ff;--muted:#9cabc1;--line:#26364d;--accent:#74a0ff;--accent2:#9db9ff;--good:#4ed69b;--bad:#ff7a7a;--warn:#ffc45f;--shadow:0 10px 32px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px max(18px,env(safe-area-inset-left));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:white;display:grid;place-items:center;font-weight:900}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;width:40px;height:40px;cursor:pointer}main{max-width:1050px;margin:0 auto;padding:22px 18px 100px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:18px;margin-bottom:20px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:22px}.hero h1{font-size:28px;line-height:1.12;margin:0 0 8px}.hero p{color:var(--muted);margin:0}.bigstat{font-size:38px;font-weight:850;letter-spacing:-1px}.substat{color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accent2);font-size:12px;font-weight:700;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.course{padding:16px}.course h3{margin:0 0 7px;font-size:15px}.course .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:10px 0 8px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:inherit}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.btn{border:0;border-radius:13px;padding:11px 15px;cursor:pointer;font-weight:750;background:var(--accent);color:#fff}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.small{padding:8px 11px;font-size:12px}.sectiontitle{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:25px 0 11px}.sectiontitle h2{margin:0;font-size:20px}.sectiontitle span{color:var(--muted);font-size:12px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.navbtn{min-width:80px;border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:12px;cursor:pointer;font-size:18px}.navbtn span{display:block;font-size:10px;margin-top:2px}.navbtn.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-bottom:14px}.field{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)}.quizwrap{max-width:760px;margin:0 auto}.quizhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}.question{padding:22px}.question h2{font-size:20px;line-height:1.38;margin:6px 0 18px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);padding:13px 14px;border-radius:13px;cursor:pointer;line-height:1.35}.opt:hover{border-color:var(--accent)}.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}.feedback{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.sourcebox{margin-top:11px;padding:11px;border-radius:11px;background:var(--bg);color:var(--muted);font-size:12px}.sourcebox a{color:var(--accent);font-weight:700;text-decoration:none}.inventory{display:grid;gap:8px}.row{padding:13px 14px}.rowtop{display:flex;gap:9px;align-items:center;justify-content:space-between}.rowid{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.row p{margin:7px 0 0;line-height:1.4}.status{font-size:11px;border-radius:999px;padding:5px 8px;background:var(--bg);white-space:nowrap}.status.mastered{color:var(--good)}.status.error{color:var(--bad)}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.statbox{padding:15px}.statbox b{font-size:22px;display:block}.statbox span{color:var(--muted);font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}.setup{max-width:700px;margin:0 auto}.setup .card{padding:18px;margin-bottom:12px}.setup label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.toggleline{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}.note{font-size:12px;line-height:1.45;color:var(--muted)}@media(max-width:720px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}main{padding-left:13px;padding-right:13px}.question{padding:17px}.question h2{font-size:18px}.navbtn{min-width:68px}.hero h1{font-size:24px}}
</style></head><body><header class="topbar"><div class="brand"><span class="logo">Q</span><div><strong>QCM Agent / Douanes</strong><small>Couverture intégrale des 8 cours</small></div></div><button id="themeBtn" class="iconbtn" aria-label="Changer de thème">◐</button></header><main id="app"><div class="card empty">Chargement de la banque QCM…</div></main><nav class="bottomnav"><button data-nav="home" class="navbtn active">⌂<span>Accueil</span></button><button data-nav="quiz" class="navbtn">▶<span>Réviser</span></button><button data-nav="inventory" class="navbtn">☷<span>Inventaire</span></button><button data-nav="stats" class="navbtn">▥<span>Stats</span></button></nav><script>(async()=>{const parts=16,chunks=[];for(let i=1;i<=parts;i++){const r=await fetch(`data-b64-${String(i).padStart(2,'0')}.txt`);if(!r.ok)throw new Error('Banque QCM introuvable');chunks.push(await r.text())}const bin=atob(chunks.join('').trim());const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();(0,eval)(text);const META=window.QCM_META, KNOW=window.QCM_KNOWLEDGE, QUESTIONS=window.QCM_QUESTIONS;
const $=s=>document.querySelector(s); const app=$('#app');
const KEY='qcm_agent_douanes_progress_v1';
let progress=JSON.parse(localStorage.getItem(KEY)||'{}');
let route='home', session=[], qi=0, answered=false, selectedCats=new Set(Object.keys(META.stats)), sessionMode='coverage', sessionSize=20;
function save(){localStorage.setItem(KEY,JSON.stringify(progress))}
function rec(id){return progress[id]||(progress[id]={attempts:0,correct:0,wrong:0,streak:0,last:0})}
function status(id){let r=progress[id]; if(!r||!r.attempts)return 'new'; if(r.streak>=2&&r.correct>=2)return 'mastered'; if(r.wrong>0&&r.streak===0)return 'error'; return 'seen'}
function catStats(cat){const units=KNOW.filter(x=>x.category===cat); let seen=0,mastered=0,errors=0;units.forEach(x=>{let s=status(x.id);if(s!=='new')seen++;if(s==='mastered')mastered++;if(s==='error')errors++});return {total:units.length,seen,mastered,errors}}
function pct(a,b){return b?Math.round(a/b*100):0}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setRoute(r){route=r;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===r));render()}
function home(){let total=META.total_knowledge_units, seen=KNOW.filter(x=>status(x.id)!=='new').length, mastered=KNOW.filter(x=>status(x.id)==='mastered').length;app.innerHTML=`<section class="hero"><div class="panel"><h1>Réviser sans laisser de trous</h1><p>Chaque unité de connaissance extraite des 8 cours possède au moins une question. Le mode Couverture 100 % donne la priorité à ce que tu n'as jamais vu.</p><div class="badge">✓ Banque : ${META.bank_coverage_percent}% des unités couvertes</div><div class="actions"><button class="btn" id="startCoverage">Continuer la couverture</button><button class="btn secondary" id="startErrors">Réviser mes erreurs</button></div></div><div class="panel"><div class="bigstat">${pct(seen,total)}%</div><div class="substat">du contenu déjà rencontré</div><div class="progress"><i style="width:${pct(seen,total)}%"></i></div><div class="substat">${seen} / ${total} unités · ${mastered} maîtrisées</div><div class="badge">Actualité figée au 31 août 2026</div></div></section><div class="sectiontitle"><h2>Les 8 matières</h2><span>${META.total_questions.toLocaleString('fr-FR')} questions</span></div><section class="grid">${Object.entries(META.stats).map(([c,m])=>{let s=catStats(c);return `<article class="card course"><h3>${esc(c)}</h3><div class="meta"><span>${s.seen}/${s.total} vues</span><span>${pct(s.mastered,s.total)}% maîtrisé</span></div><div class="progress"><i style="width:${pct(s.seen,s.total)}%"></i></div><div class="meta"><span>${m.questions} questions</span><span>${s.errors?`${s.errors} à revoir`:'aucune erreur active'}</span></div><div class="actions"><button class="btn small" data-catquiz="${esc(c)}">Réviser</button></div></article>`}).join('')}</section>`;$('#startCoverage').onclick=()=>{sessionMode='coverage';setRoute('quiz')};$('#startErrors').onclick=()=>{sessionMode='errors';setRoute('quiz')};document.querySelectorAll('[data-catquiz]').forEach(b=>b.onclick=()=>{selectedCats=new Set([b.dataset.catquiz]);sessionMode='coverage';setRoute('quiz')})}
function quizSetup(){app.innerHTML=`<section class="setup"><div class="sectiontitle"><h2>Nouvelle session</h2><span>${META.total_questions} questions disponibles</span></div><div class="card"><label>Mode</label><div class="toggleline">${[['coverage','Couverture 100 %'],['errors','Erreurs'],['random','Aléatoire']].map(([v,l])=>`<button class="chip ${sessionMode===v?'on':''}" data-mode="${v}">${l}</button>`).join('')}</div></div><div class="card"><label>Matières</label><div class="toggleline">${Object.keys(META.stats).map(c=>`<button class="chip ${selectedCats.has(c)?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="card"><label>Nombre de questions</label><select id="size" class="field"><option>10</option><option ${sessionSize===20?'selected':''}>20</option><option ${sessionSize===50?'selected':''}>50</option><option value="100">100</option></select></div><button id="launch" class="btn" style="width:100%">Lancer la session</button><p class="note">Le mode Couverture choisit d'abord les unités jamais rencontrées, puis les moins maîtrisées. Une même connaissance peut avoir plusieurs formulations pour éviter la simple mémorisation de la phrase.</p></section>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{sessionMode=b.dataset.mode;quizSetup()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{let c=b.dataset.cat;if(selectedCats.has(c)&&selectedCats.size>1)selectedCats.delete(c);else selectedCats.add(c);quizSetup()});$('#size').onchange=e=>sessionSize=+e.target.value;$('#launch').onclick=launchSession}
function launchSession(){let qs=QUESTIONS.filter(q=>selectedCats.has(q.category));let byAtom={};qs.forEach(q=>(byAtom[q.atom_id]||(byAtom[q.atom_id]=[])).push(q));let atoms=Object.keys(byAtom);if(sessionMode==='errors')atoms=atoms.filter(id=>progress[id]?.wrong>0);if(sessionMode==='coverage')atoms.sort((a,b)=>{let ra=progress[a]||{},rb=progress[b]||{};let sa=status(a),sb=status(b);let rank={new:0,error:1,seen:2,mastered:3};return rank[sa]-rank[sb]||(ra.attempts||0)-(rb.attempts||0)||Math.random()-.5});else atoms.sort(()=>Math.random()-.5);atoms=atoms.slice(0,sessionSize);session=atoms.map(id=>{let arr=byAtom[id];return arr[Math.floor(Math.random()*arr.length)]});qi=0;answered=false;if(!session.length){app.innerHTML='<div class="card empty">Aucune question ne correspond à ce filtre.</div>';return}showQuestion()}
function showQuestion(){let q=session[qi];answered=false;app.innerHTML=`<section class="quizwrap"><div class="quizhead"><span>${esc(q.category)} · ${qi+1}/${session.length}</span><span>${esc(q.atom_id)}</span></div><div class="progress"><i style="width:${Math.round(qi/session.length*100)}%"></i></div><article class="card question"><div class="badge">${esc(q.section||q.category)}</div><h2>${esc(q.prompt)}</h2><div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="feedback"></div></article></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(q,+b.dataset.i))}
function answer(q,i){if(answered)return;answered=true;let ok=i===q.correct_index,r=rec(q.atom_id);r.attempts++;r.last=Date.now();if(ok){r.correct++;r.streak++}else{r.wrong++;r.streak=0}save();document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.correct_index)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'Bonne réponse':'À revoir'}</strong><div class="sourcebox">${esc(q.explanation)}<br><br>Référence : cours source · page ${q.source_page}</div><div class="actions"><button id="next" class="btn">${qi+1<session.length?'Question suivante':'Voir le bilan'}</button></div></div>`;$('#next').onclick=()=>{qi++;if(qi<session.length)showQuestion();else sessionEnd()}}
function sessionEnd(){let ids=[...new Set(session.map(q=>q.atom_id))], m=ids.filter(id=>status(id)==='mastered').length,e=ids.filter(id=>status(id)==='error').length;app.innerHTML=`<section class="quizwrap"><div class="panel"><h1>Session terminée</h1><p>${ids.length} unités travaillées.</p><div class="statgrid"><div class="card statbox"><b>${m}</b><span>maîtrisées</span></div><div class="card statbox"><b>${e}</b><span>à revoir</span></div></div><div class="actions"><button class="btn" id="again">Nouvelle session</button><button class="btn secondary" id="home">Accueil</button></div></div></section>`;$('#again').onclick=()=>quizSetup();$('#home').onclick=()=>setRoute('home')}
function inventory(){app.innerHTML=`<div class="sectiontitle"><h2>Inventaire des connaissances</h2><span>${KNOW.length} unités</span></div><div class="filters"><input id="search" class="field" placeholder="Rechercher une date, un nom, une notion…"><select id="catf" class="field"><option value="">Toutes les matières</option>${Object.keys(META.stats).map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="statf" class="field"><option value="">Tous les statuts</option><option value="new">Jamais vue</option><option value="seen">Vue</option><option value="error">À revoir</option><option value="mastered">Maîtrisée</option></select></div><div id="inv" class="inventory"></div>`;['search','catf','statf'].forEach(id=>$('#'+id).oninput=renderInv);renderInv()}
function renderInv(){let s=($('#search')?.value||'').toLowerCase(),c=$('#catf')?.value||'',st=$('#statf')?.value||'';let arr=KNOW.filter(x=>(!c||x.category===c)&&(!st||status(x.id)===st)&&(!s||(x.statement+' '+x.section).toLowerCase().includes(s))).slice(0,250);$('#inv').innerHTML=arr.length?arr.map(x=>{let z=status(x.id),lab={new:'Jamais vue',seen:'Vue',error:'À revoir',mastered:'Maîtrisée'}[z];return `<article class="card row"><div class="rowtop"><span class="rowid">${x.id} · ${esc(x.category)} · p.${x.page}</span><span class="status ${z}">${lab}</span></div><p>${esc(x.statement)}</p></article>`}).join(''):'<div class="card empty">Aucun résultat.</div>'}
function statsView(){let total=KNOW.length,seen=KNOW.filter(x=>status(x.id)!=='new').length,mastered=KNOW.filter(x=>status(x.id)==='mastered').length,errors=KNOW.filter(x=>status(x.id)==='error').length;app.innerHTML=`<div class="sectiontitle"><h2>Progression</h2><span>stockée sur cet appareil</span></div><div class="statgrid"><div class="card statbox"><b>${pct(seen,total)}%</b><span>couverture personnelle</span></div><div class="card statbox"><b>${mastered}</b><span>maîtrisées</span></div><div class="card statbox"><b>${errors}</b><span>à revoir</span></div><div class="card statbox"><b>${META.bank_coverage_percent}%</b><span>couverture de la banque</span></div></div><div class="sectiontitle"><h2>Par matière</h2></div><div class="grid">${Object.keys(META.stats).map(c=>{let s=catStats(c);return `<div class="card course"><h3>${esc(c)}</h3><div class="progress"><i style="width:${pct(s.seen,s.total)}%"></i></div><div class="meta"><span>${s.seen}/${s.total} vues</span><span>${s.mastered} maîtrisées</span></div></div>`}).join('')}</div><div class="sectiontitle"><h2>Sauvegarde</h2></div><div class="actions"><button class="btn secondary" id="export">Exporter ma progression</button><label class="btn secondary" style="cursor:pointer">Importer<input id="import" type="file" accept="application/json" hidden></label><button class="btn bad" id="reset">Réinitialiser</button></div><p class="note">« Banque 100 % » signifie : chacune des ${META.total_knowledge_units} unités extraites des huit cours a au moins une question liée. Cela ne signifie pas que toute la culture générale possible au concours est contenue dans les cours.</p>`;$('#export').onclick=()=>{let b=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='progression-qcm.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{progress=JSON.parse(r.result);save();statsView()}catch{alert('Fichier invalide')}};r.readAsText(f)};$('#reset').onclick=()=>{if(confirm('Effacer toute la progression ?')){progress={};save();statsView()}}}
function render(){if(route==='home')home();else if(route==='quiz')quizSetup();else if(route==='inventory')inventory();else statsView()}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>setRoute(b.dataset.nav));$('#themeBtn').onclick=()=>{let d=document.documentElement,cur=d.dataset.theme||localStorage.getItem('qcm_theme')||'';let next=cur==='dark'?'':'dark';d.dataset.theme=next;localStorage.setItem('qcm_theme',next)};document.documentElement.dataset.theme=localStorage.getItem('qcm_theme')||'';render();
})().catch(e=>{document.getElementById('app').innerHTML=`<div class="card empty"><h2>Impossible de charger l’application</h2><p>${e.message}</p></div>`;console.error(e)});</script></body></html>
