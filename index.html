<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>QCM Agent / Douanes</title>
<style>
:root{
  --bg:#f6f7fb;--bg2:#eef1f8;--card:rgba(255,255,255,.88);--card-solid:#fff;
  --text:#172033;--muted:#6f7788;--line:#e4e7ef;
  --primary:#5b5bd6;--primary2:#7c6ee6;--primary-dark:#4747b8;
  --ok:#16845f;--ok-soft:#ecf8f3;--bad:#c74655;--bad-soft:#fff0f2;
  --soft:#f0efff;--purple-soft:#f4efff;--shadow:0 14px 40px rgba(32,42,78,.08);
  --shadow-hover:0 18px 46px rgba(38,48,88,.13);
}
[data-theme="dark"]{
  --bg:#111522;--bg2:#171d2d;--card:rgba(28,35,52,.9);--card-solid:#1b2334;
  --text:#f4f6fb;--muted:#aab2c2;--line:#30394c;
  --primary:#8c86ff;--primary2:#aa8cff;--primary-dark:#716ae8;
  --ok:#58c89d;--ok-soft:#17392f;--bad:#ff7a87;--bad-soft:#42242a;
  --soft:#28294d;--purple-soft:#30264a;--shadow:0 14px 40px rgba(0,0,0,.22);
  --shadow-hover:0 18px 46px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 8% -8%,rgba(124,110,230,.14),transparent 32rem),
    radial-gradient(circle at 92% 10%,rgba(91,91,214,.09),transparent 28rem),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
button,select,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.top{
  position:sticky;top:0;z-index:20;min-height:72px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px max(18px,calc((100vw - 980px)/2));
  background:color-mix(in srgb,var(--card-solid) 82%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--line) 82%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;
  color:#fff;font-size:19px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(145deg,var(--primary),var(--primary2));
  box-shadow:0 8px 22px rgba(91,91,214,.28);
}
.brand-copy{min-width:0}
.top b{display:block;font-size:16px;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme{
  width:40px;height:40px;border:1px solid var(--line);border-radius:12px;cursor:pointer;
  background:var(--card);color:var(--text);box-shadow:0 4px 14px rgba(20,30,60,.05);
  transition:.18s ease;
}
.theme:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
main{max-width:980px;margin:auto;padding:28px 18px 112px}
h1,h2,h3{letter-spacing:-.025em}
h2{font-size:21px;margin:26px 2px 12px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px;margin:12px 0;box-shadow:var(--shadow);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.hero{overflow:hidden;padding:25px}
.hero:before{
  content:"";position:absolute;width:220px;height:220px;right:-90px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,110,230,.15),transparent 68%);pointer-events:none;
}
.hero h1{margin:0 0 8px;font-size:29px;line-height:1.16}
.hero p{max-width:720px;margin:0;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cat{
  --cat:var(--primary);cursor:pointer;overflow:hidden;padding:18px 18px 17px;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.cat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.cat:after{content:"";position:absolute;width:76px;height:76px;border-radius:50%;right:-30px;top:-30px;background:color-mix(in srgb,var(--cat) 12%,transparent)}
.cat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb,var(--cat) 30%,var(--line))}
.cat:nth-child(1){--cat:#d26464}.cat:nth-child(2){--cat:#4d91c9}.cat:nth-child(3){--cat:#8a65c7}.cat:nth-child(4){--cat:#d59047}.cat:nth-child(5){--cat:#4c9f85}.cat:nth-child(6){--cat:#5968d9}.cat:nth-child(7){--cat:#a260b1}.cat:nth-child(8){--cat:#538f6d}
.cat b{display:block;margin:0 0 5px;font-size:15.5px;padding-right:20px}
.bar{height:8px;background:color-mix(in srgb,var(--line) 80%,transparent);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--primary2));box-shadow:0 0 10px rgba(91,91,214,.18);transition:width .35s ease}
.btn{
  border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;font-weight:760;cursor:pointer;box-shadow:0 7px 18px rgba(91,91,214,.20);
  transition:transform .17s ease,box-shadow .17s ease,filter .17s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,91,214,.27);filter:saturate(1.06)}
.btn:active{transform:translateY(0)}
.btn.alt{background:var(--card-solid);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.alt:hover{border-color:color-mix(in srgb,var(--primary) 35%,var(--line));color:var(--primary)}
.btn.bad{background:linear-gradient(135deg,#c74655,#df6370)}
.wide{width:100%;padding:13px 16px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.chip{
  border:1px solid var(--line);background:var(--card-solid);color:var(--text);border-radius:999px;
  padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;transition:.16s ease;
}
.chip:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line));transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(91,91,214,.18)}
.chip:disabled{opacity:.45;cursor:not-allowed;transform:none}
.opt{
  position:relative;width:100%;text-align:left;background:var(--card-solid);color:var(--text);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0;cursor:pointer;line-height:1.45;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.opt:hover:not(:disabled){transform:translateX(3px);border-color:color-mix(in srgb,var(--primary) 45%,var(--line));box-shadow:0 7px 18px rgba(35,45,80,.06)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 9%,transparent)}
.feedback{border-top:1px solid var(--line);margin-top:18px;padding-top:17px}
.feedback b{font-size:16px}.feedback p{line-height:1.55}
.ok{color:var(--ok)}.ko{color:var(--bad)}
.row{font-size:13px;padding:16px 18px}.row code{color:var(--muted);font-size:11.5px}.row p{margin:7px 0 0;font-size:14px}
.nav{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;justify-content:center;gap:4px;width:min(92vw,540px);
  padding:7px;border:1px solid color-mix(in srgb,var(--line) 90%,transparent);border-radius:18px;
  background:color-mix(in srgb,var(--card-solid) 90%,transparent);box-shadow:0 14px 38px rgba(25,33,62,.15);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.nav button{
  flex:1;border:0;background:transparent;padding:10px 8px;border-radius:12px;color:var(--muted);
  cursor:pointer;font-size:13px;font-weight:650;transition:.16s ease;
}
.nav button:hover{color:var(--primary);background:var(--soft)}
.nav button.on{color:var(--primary);font-weight:800;background:var(--soft)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}
.field{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--card-solid);color:var(--text);outline:none;transition:.16s ease;
}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
.stat{font-size:31px;font-weight:850;letter-spacing:-1px}
.tag{
  display:inline-flex;align-items:center;background:var(--soft);color:var(--primary-dark);border-radius:999px;
  padding:6px 10px;font-size:11.5px;font-weight:760;margin-top:7px
}
.tag.practice{background:var(--purple-soft);color:color-mix(in srgb,var(--primary2) 85%,var(--text))}
.load{display:flex;align-items:center;justify-content:center;gap:12px;min-height:88px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--primary);animation:pulse .85s infinite alternate;box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 10%,transparent)}
@keyframes pulse{to{opacity:.25;transform:scale(.82)}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;color:var(--muted);font-size:12px}
.matrix{margin:14px auto;border-collapse:separate;border-spacing:4px;font-size:20px}.matrix td{border:1px solid var(--line);background:var(--card-solid);padding:13px;border-radius:9px;text-align:center;min-width:48px}
::selection{background:color-mix(in srgb,var(--primary) 22%,transparent)}
@media(max-width:650px){
  .top{min-height:64px;padding:10px 13px}.logo{width:38px;height:38px;flex-basis:38px;border-radius:12px}.top b{font-size:15px}.top small{font-size:10.5px}
  main{padding:20px 12px 104px}.grid{grid-template-columns:1fr;gap:9px}.filters{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:24px}.card{border-radius:17px;padding:17px}.cat{padding:16px}.nav{bottom:10px;width:calc(100vw - 20px);border-radius:16px}.nav button{font-size:12px;padding:9px 5px}.opt{padding:13px}.theme{width:37px;height:37px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">Q</div>
    <div class="brand-copy"><b>QCM Agent / Douanes</b><small>8 matières · connaissances + exercices type concours</small></div>
  </div>
  <button class="theme" id="themeToggle" aria-label="Changer de thème" title="Changer de thème">◐</button>
</header>
<main id="app"><div class="card load"><span class="dot"></span><span>Chargement de la banque QCM…</span></div></main>
<nav class="nav" aria-label="Navigation principale"><button data-r="home" class="on">Accueil</button><button data-r="quiz">Réviser</button><button data-r="inventory">Inventaire</button><button data-r="stats">Stats</button></nav>
<script>
(()=>{const k='qcm-theme',b=document.documentElement,t=document.getElementById('themeToggle');const apply=v=>{b.dataset.theme=v;t.textContent=v==='dark'?'☀':'◐';localStorage.setItem(k,v)};apply(localStorage.getItem(k)||'light');t.onclick=()=>apply(b.dataset.theme==='dark'?'light':'dark')})();
</script>
<script src="helper.js"></script>
<script src="engine-math.js"></script>
<script src="engine-logic.js"></script>
<script src="math-course-links.js"></script>
<script src="app.js"></script>
</body>
</html>
