name: QCM quality audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit all knowledge facts
        run: node audit-run-v28.mjs
      - name: Build audit snapshots
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json','utf8'));
          const indexed = report.rows.map((r,i)=>({
            ...r,
            previousSource: i>0 ? {id:report.rows[i-1].id,source:report.rows[i-1].source,cat:report.rows[i-1].cat,page:report.rows[i-1].page} : null,
            nextSource: i<report.rows.length-1 ? {id:report.rows[i+1].id,source:report.rows[i+1].source,cat:report.rows[i+1].cat,page:report.rows[i+1].page} : null
          }));
          const rows = indexed
            .filter(r => !r.allPass && !r.sourceResolvedNonAtomic)
            .sort((a,b) => {
              const sa = a.sourceRejected ? 0 : (a.anyQuestion ? 2 : 1);
              const sb = b.sourceRejected ? 0 : (b.anyQuestion ? 2 : 1);
              return sa - sb || (b.issues?.length || 0) - (a.issues?.length || 0);
            })
            .slice(0,250);
          fs.writeFileSync('audit-priority.json', JSON.stringify({summary: report.summary, rows}, null, 2));

          const noQuestion = indexed
            .filter(r => !r.sourceResolvedNonAtomic && !r.anyQuestion)
            .map(r => ({
              id:r.id, cat:r.cat, page:r.page, chapter:r.chapter, topic:r.topic,
              source:r.source, previousSource:r.previousSource, nextSource:r.nextSource
            }));
          fs.writeFileSync('audit-no-question.json', JSON.stringify({
            generatedAt: report.summary.generatedAt,
            count: noQuestion.length,
            byCat: noQuestion.reduce((m,r)=>(m[r.cat]=(m[r.cat]||0)+1,m),{}),
            rows:noQuestion
          }, null, 2));
          NODE
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: qcm-audit-report
          path: |
            audit-summary.json
            audit-report.json
            audit-priority.json
            audit-no-question.json
      - name: Persist audit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-summary.json audit-priority.json audit-no-question.json
          if ! git diff --cached --quiet; then
            git commit -m "Update QCM audit snapshot [skip ci]"
            git push
          fi